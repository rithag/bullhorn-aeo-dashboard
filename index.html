<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bullhorn AEO Dashboard — Mockup</title>
<style>
:root{
  --bg:#F3F5F7; --card:#FFFFFF; --border:#DFE4EA;
  --ink:#1B2430; --ink-soft:#5B6472; --ink-faint:#8B93A1;
  --brand:#1F6F6B; --brand-soft:#E4F0EF;
  --dem:#2E5EAA; --dem-soft:#E7EEFA;
  --rep:#B23B3B; --rep-soft:#FAEBEB;
  --good:#3C8A5B; --warn:#C98A2E; --bad:#B23B3B;
  --shadow:0 1px 2px rgba(20,30,40,.04), 0 1px 8px rgba(20,30,40,.04);
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}
.app{display:flex;min-height:100vh;}
.sidebar{width:220px;flex:0 0 220px;background:#161D26;color:#C9D1DA;padding:20px 0;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:9px;padding:0 20px 18px;border-bottom:1px solid #2A333F;margin-bottom:10px;}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px;flex:none;}
.brand-name{font-size:14px;font-weight:600;color:#fff;line-height:1.2;}
.brand-sub{font-size:10.5px;color:#7C8797;letter-spacing:.03em;}
.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#5C6675;padding:14px 20px 6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;font-size:13.5px;border-left:3px solid transparent;color:#B7C0CC;}
.nav-item:hover{background:#1D2632;color:#fff;}
.nav-item.active{background:#1D2632;border-left-color:var(--brand);color:#fff;font-weight:600;}
.nav-dot{width:7px;height:7px;border-radius:50%;flex:none;}
.mock-banner{margin:16px 16px 0;padding:9px 11px;background:#2A2116;border:1px solid #4A3A22;border-radius:8px;font-size:11px;color:#E0B876;line-height:1.4;}
.main{flex:1;min-width:0;padding:26px 32px 60px;max-width:1560px;position:relative;}
.page{display:none;} .page.active{display:block;}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.page-title{font-size:22px;font-weight:700;letter-spacing:-.01em;}
.page-desc{font-size:13px;color:var(--ink-soft);margin-top:3px;max-width:680px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);}
.kpi.hi{border-color:var(--brand);background:var(--brand-soft);}
.kpi-label{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
.kpi-value{font-size:23px;font-weight:700;margin-top:4px;}
.kpi-sub{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.row2{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;align-items:start;}
.row2-stretch{align-items:stretch;}
.row2-stretch>.card{display:flex;flex-direction:column;}
.row2-stretch>.card>div:last-child{flex:1;display:flex;align-items:center;}
.row2-stretch>.card>div:last-child>svg{width:100%;}
.row-eq{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:1150px){.row2,.row-eq{grid-template-columns:1fr;}}
.card-title{font-size:13.5px;font-weight:700;margin:0 0 2px;}
.card-caption{font-size:11.5px;color:var(--ink-soft);margin-bottom:10px;}
.section-gap{margin-top:16px;}
.filterbar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:14px;box-shadow:var(--shadow);}
.filterbar label{font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;font-weight:600;display:block;margin-bottom:2px;}
.subfilter-row label{font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;font-weight:600;display:block;margin-bottom:2px;}
.fitem{display:flex;flex-direction:column;}
select, input[type=date]{font-family:inherit;font-size:12.5px;padding:6px 8px;border:1px solid var(--border);border-radius:7px;background:#fbfcfd;color:var(--ink);min-width:104px;}
select[multiple]{min-height:64px;min-width:130px;}
.filterbar .spacer{flex:1;}
.btn{background:var(--brand);color:#fff;border:none;border-radius:7px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand);}
.btn.sm{padding:4px 9px;font-size:11px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);border-bottom:1px solid var(--border);padding:6px 8px;cursor:pointer;white-space:nowrap;}
th:hover{color:var(--ink);}
th.sorted{color:var(--brand);}
td{padding:7px 8px;border-bottom:1px solid #EEF1F4;white-space:nowrap;}
tr.clickable:hover td{background:#FAFBFC;cursor:pointer;}
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10.5px;font-weight:700;}
.badge.dem{background:var(--dem-soft);color:var(--dem);}
.badge.rep{background:var(--rep-soft);color:var(--rep);}
.badge.np{background:#EEF0F3;color:var(--ink-soft);}
.heat{border-radius:5px;padding:2px 7px;font-weight:700;display:inline-block;min-width:34px;text-align:center;}
.namecell{font-weight:600;cursor:pointer;color:var(--ink);}
.namecell:hover{color:var(--brand);text-decoration:underline;}
.gap-pos{color:var(--bad);font-weight:700;} .gap-neg{color:var(--good);font-weight:700;}
.scroll-table{max-height:460px;overflow:auto;border:1px solid var(--border);border-radius:10px;}
.scroll-table table{font-size:12px;}
.scroll-table th{position:sticky;top:0;background:#fff;z-index:1;}
.legend-row{display:flex;gap:14px;font-size:11.5px;color:var(--ink-soft);margin-top:8px;flex-wrap:wrap;}
.legend-row span{display:inline-flex;align-items:center;gap:5px;}
.legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
.callout{border-left:3px solid var(--brand);background:var(--brand-soft);border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.5;color:#134441;}
.callout.insight{padding:12px 14px;margin-bottom:16px;}
.insight-head{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px;display:flex;align-items:center;gap:6px;color:#134441;}
.insight-spark{font-size:13px;}
.insight-list{margin:0;padding-left:18px;}
.insight-list li{margin-bottom:5px;line-height:1.5;font-size:12.5px;}
.insight-list li:last-child{margin-bottom:0;}
.cb-crumb-link{cursor:pointer;color:var(--brand);}
.cb-crumb-link:hover{text-decoration:underline;}
.drill-detail{border-top:1px solid var(--border);padding-top:10px;margin-top:10px;}
.tag{font-size:10px;padding:1px 6px;border-radius:5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.tag.recur{background:#FBEAEA;color:var(--bad);}
.small-muted{font-size:11px;color:var(--ink-faint);}
.expand-sub{background:#FAFBFC;}
.expand-sub td{border-bottom:1px solid #EEF1F4;}
.err-banner{background:#FBEAEA;border:1px solid #E9C0C0;color:#8A2E2E;border-radius:8px;padding:10px 12px;font-size:12px;margin-bottom:12px;}
.fanout-wrap{margin-top:8px;padding:10px 12px;background:#FAFBFC;border:1px solid var(--border);border-radius:10px;}
.fanout-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;color:var(--ink-soft);}
.topic-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;}
.topic-name{width:140px;flex:none;}
.topic-track{flex:1;height:10px;background:#EEF1F4;border-radius:5px;overflow:hidden;}
.topic-fill{height:100%;border-radius:5px;}
.topic-fill.core{background:var(--dem);}
.topic-fill.emergent{background:#C7B98A;}
.topic-pct{width:32px;text-align:right;font-weight:700;flex:none;font-size:11.5px;}
.stack-track{flex:1;height:12px;background:#EEF1F4;border-radius:6px;overflow:hidden;display:flex;}
.stack-seg{height:100%;}
.drill-hint{display:flex;align-items:center;gap:4px;flex:none;color:var(--ink-faint);font-size:10.5px;}
.drill-chevron{width:6px;height:6px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);}
.drillable-row{cursor:pointer;transition:background .1s;border-radius:6px;padding:4px 6px;margin:0 -6px 6px;}
.drillable-row:hover{background:#F3F6F8;}
.drillable-row:hover .drill-hint{color:var(--brand);}
.two-col-panels{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:900px){.two-col-panels{grid-template-columns:1fr;}}
/* Side panel (Prompt Fanout drill-in) */
.overlay{position:fixed;inset:0;background:rgba(20,30,40,.35);display:none;z-index:50;}
.overlay.open{display:block;}
.sidepanel{position:fixed;top:0;right:0;width:460px;max-width:92vw;height:100vh;background:#fff;box-shadow:-8px 0 24px rgba(0,0,0,.15);z-index:51;transform:translateX(100%);transition:transform .18s ease;overflow-y:auto;padding:20px;}
.sidepanel.wide{width:760px;}
.sidepanel.open{transform:translateX(0);}
.sidepanel-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink-soft);}
.hist-item{border:1px solid var(--border);border-radius:9px;padding:9px 10px;margin-bottom:8px;cursor:pointer;font-size:12px;}
.hist-item:hover{border-color:var(--brand);}
.run-detail{border:1px solid var(--border);border-radius:9px;padding:12px;background:#FAFBFC;font-size:12.5px;line-height:1.55;}
.dimscore-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;font-size:12px;}
.dimscore-grid div{display:flex;justify-content:space-between;background:#fff;border:1px solid var(--border);border-radius:6px;padding:4px 8px;}

/* ============================================================================
   CUSTOM DROPDOWN COMPONENT (visually replaces native <select> elements;
   the native <select> stays in the DOM, hidden, as the real source of truth —
   every existing filter/change-handler keeps working unmodified)
   ============================================================================ */
.xsel-native{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.xsel{position:relative;display:inline-flex;flex-direction:column;min-width:150px;}
.xsel-trigger{display:flex;align-items:center;gap:6px;font-family:inherit;font-size:12.5px;padding:6px 9px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer;min-height:30px;transition:border-color .12s,box-shadow .12s;}
.xsel-trigger:hover{border-color:#C3CCD6;}
.xsel.open .xsel-trigger{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
.xsel-trigger-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);}
.xsel-trigger-label.placeholder{color:var(--ink-faint);}
.xsel-chevron{flex:none;width:9px;height:9px;border-right:1.6px solid var(--ink-faint);border-bottom:1.6px solid var(--ink-faint);transform:rotate(45deg);margin-top:-3px;transition:transform .12s;}
.xsel.open .xsel-chevron{transform:rotate(-135deg);margin-top:2px;}
.xsel-badge{flex:none;background:var(--brand);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 6px;line-height:1.4;}
.xsel-panel{position:absolute;top:calc(100% + 5px);left:0;min-width:100%;width:max-content;max-width:290px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 6px 20px rgba(20,30,40,.13);z-index:40;display:none;overflow:hidden;}
.xsel.open .xsel-panel{display:block;}
.xsel.panel-right .xsel-panel{left:auto;right:0;}
.xsel-search{padding:7px;border-bottom:1px solid var(--border);}
.xsel-search input{width:100%;font-family:inherit;font-size:12px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:#fbfcfd;}
.xsel-search input:focus{outline:none;border-color:var(--brand);}
.xsel-actions{display:flex;gap:0;border-bottom:1px solid var(--border);}
.xsel-actions button{flex:1;background:none;border:none;font-family:inherit;font-size:11px;font-weight:600;color:var(--brand);padding:6px 4px;cursor:pointer;}
.xsel-actions button:hover{background:var(--brand-soft);}
.xsel-actions button+button{border-left:1px solid var(--border);}
.xsel-list{max-height:230px;overflow-y:auto;padding:4px;}
.xsel-opt{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--ink);}
.xsel-opt:hover{background:var(--bg);}
.xsel-opt.selected{background:var(--brand-soft);color:#134441;font-weight:600;}
.xsel-opt.focused{outline:1.5px solid var(--brand);outline-offset:-1.5px;}
.xsel-check{flex:none;width:14px;height:14px;border:1.6px solid #C3CCD6;border-radius:4px;display:flex;align-items:center;justify-content:center;background:#fff;}
.xsel-opt.selected .xsel-check{background:var(--brand);border-color:var(--brand);}
.xsel-check svg{display:none;width:9px;height:9px;}
.xsel-opt.selected .xsel-check svg{display:block;}
.xsel-opt-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.xsel-empty{padding:14px 10px;text-align:center;color:var(--ink-faint);font-size:12px;}
.xsel-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
.xsel-chip{display:inline-flex;align-items:center;gap:4px;background:var(--brand-soft);color:#134441;font-size:10.5px;font-weight:600;border-radius:5px;padding:2px 5px 2px 7px;max-width:120px;}
.xsel-chip-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.xsel-chip-x{flex:none;cursor:pointer;font-size:12px;line-height:1;color:#4A7D79;padding:0 1px;}
.xsel-chip-x:hover{color:#0F2E2C;}
.xsel-chip-more{display:inline-flex;align-items:center;background:#EEF1F4;color:var(--ink-soft);font-size:10.5px;font-weight:600;border-radius:5px;padding:2px 6px;}

/* ============================================================================
   COLLAPSED FILTER BAR — replaces a long row of visible dropdowns with a
   single "Filters" trigger + active-filter chips + a grouped popover panel.
   ============================================================================ */
.filterbar.fbar{display:block;padding:9px 10px;position:relative;}
.fbar-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px;}
.fbar-head>label{margin:0;align-self:center;}
.fbar-trigger{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:6px 11px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;}
.fbar-trigger:hover{border-color:#C3CCD6;}
.fbar.open .fbar-trigger{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
.fbar-trigger svg{width:13px;height:13px;flex:none;color:var(--ink-soft);}
.fbar-count{background:var(--brand);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:1px 6px;min-width:16px;text-align:center;}
.fbar-dates{display:flex;gap:8px;align-items:flex-end;}
.fbar-search{display:flex;gap:8px;align-items:flex-end;}
.fbar-search input{min-width:170px;}
.fbar-chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0;}
.fbar-chipline{display:flex;align-items:center;gap:8px;flex-basis:100%;min-width:0;}
.fbar-chip{display:inline-flex;align-items:center;gap:5px;background:var(--brand-soft);color:#134441;font-size:11.5px;border-radius:7px;padding:4px 6px 4px 9px;max-width:230px;}
.fbar-chip b{font-weight:700;}
.fbar-chip span.fbar-chip-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fbar-chip-x{cursor:pointer;font-size:12px;color:#4A7D79;padding:0 2px;flex:none;}
.fbar-chip-x:hover{color:#0F2E2C;}
.fbar-reset{background:none;border:none;font-family:inherit;font-size:11.5px;font-weight:600;color:var(--ink-faint);cursor:pointer;padding:4px 2px;text-decoration:underline;flex:none;}
.fbar-reset:hover{color:var(--bad);}
.fbar-panel{display:none;position:absolute;top:calc(100% + 6px);left:10px;right:10px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 28px rgba(20,30,40,.16);z-index:39;padding:14px 16px;}
.fbar.open .fbar-panel{display:block;}
.fbar-panel-grid{display:flex;flex-wrap:wrap;gap:12px 16px;}
.fbar-panel .fitem{min-width:150px;}
.fbar-panel-foot{display:flex;justify-content:flex-end;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);}
@media (max-width:640px){.fbar-panel{left:0;right:0;}}
</style>
</head>
<body>
<div id="data-loading" style="position:fixed;inset:0;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;color:#555;">Loading dashboard data…</div>
<div class="app">
  <div class="sidebar">
    <div class="brand"><div class="brand-mark">B</div><div><div class="brand-name">Bullhorn AEO</div><div class="brand-sub">Scoring dashboard</div></div></div>
    <div class="nav-group-label">Overview</div>
    <div class="nav-item active" data-page="overview"><span class="nav-dot" style="background:var(--brand)"></span>Aggregate</div>
    <div class="nav-item" data-page="fanout"><span class="nav-dot" style="background:var(--brand)"></span>Prompt Fanout</div>
    <div class="nav-group-label">Dimensions</div>
    <div class="nav-item" data-page="visibility"><span class="nav-dot" style="background:#6B8FC9"></span>Visibility</div>
    <div class="nav-item" data-page="favorability"><span class="nav-dot" style="background:#7FA98F"></span>Favorability</div>
    <div class="nav-item" data-page="depth"><span class="nav-dot" style="background:#B79A5C"></span>Depth</div>
    <div class="nav-item" data-page="accuracy"><span class="nav-dot" style="background:var(--bad)"></span>Accuracy</div>
    <div class="nav-item" data-page="consistency"><span class="nav-dot" style="background:#8B7FB0"></span>Consistency</div>
    <div class="nav-item" data-page="narrative"><span class="nav-dot" style="background:#4F8B8B"></span>Narrative Alignment</div>
    <div class="nav-group-label">Diagnostics</div>
    <div class="nav-item" data-page="prompthealth"><span class="nav-dot" style="background:#C9915A"></span>Prompt Diagnostics</div>
    <div class="nav-item" data-page="citations"><span class="nav-dot" style="background:#6B9BC9"></span>Citation Breakout</div>
  </div>

  <div class="main" id="main-root">
    <div class="page active" id="page-overview"></div>
    <div class="page" id="page-fanout"></div>
    <div class="page" id="page-visibility"></div>
    <div class="page" id="page-favorability"></div>
    <div class="page" id="page-depth"></div>
    <div class="page" id="page-accuracy"></div>
    <div class="page" id="page-consistency"></div>
    <div class="page" id="page-narrative"></div>
    <div class="page" id="page-prompthealth"></div>
    <div class="page" id="page-citations"></div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeSidePanel()"></div>
<div class="sidepanel" id="sidepanel">
  <button class="sidepanel-close" onclick="closeSidePanel()">✕</button>
  <div id="sidepanel-content"></div>
</div>

<script>
'use strict';
/* ============================================================================
   0. SAFETY HARNESS — wrap every render call so one failure never cascades
   ============================================================================ */
function safe(label, fn){
  try{ fn(); }
  catch(err){
    console.error('Render error in '+label+':', err);
    const el = document.getElementById('page-'+label) || document.getElementById(label);
    if(el) el.insertAdjacentHTML('afterbegin', `<div class="err-banner">⚠ Render error in "${label}": ${String(err.message||err)}. Other tabs are unaffected.</div>`);
  }
}

/* ============================================================================
   1. SEEDED RNG (deterministic — same inputs always produce same mock output)
   ============================================================================ */
function strHash(str){ let h=2166136261>>>0; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return((t^t>>>14)>>>0)/4294967296; }; }
let RNG = mulberry32(42);
function rnd(min,max){return min+RNG()*(max-min);}
function rndInt(min,max){return Math.floor(rnd(min,max+1));}
function pick(arr){return arr[Math.floor(RNG()*arr.length)];}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function seededRng(seedStr){ return mulberry32(strHash(seedStr)); }

/* ============================================================================
   2. LIGHTWEIGHT SVG CHART HELPERS (no external library / no CDN dependency)
   ============================================================================ */
function svgEl(tag,attrs){ let s='<'+tag; for(const k in attrs){ s+=` ${k}="${attrs[k]}"`; } return s+'/>'; }
/* Measures a chart container's real rendered width so the SVG viewBox matches it (avoiding
   letterboxed whitespace when the container is wider than a hardcoded default). Floors at 200px —
   a transient layout pass (e.g. right as a page becomes visible) can report a small-but-nonzero
   width that would otherwise squash the chart before the container settles to its real size. */
function measuredChartWidth(containerId, fallback){
  const el = document.getElementById(containerId);
  const w = el && el.clientWidth;
  return (w && w>=200) ? w : fallback;
}
function svgElOpen(tag,attrs){ let s='<'+tag; for(const k in attrs){ s+=` ${k}="${attrs[k]}"`; } return s+'>'; }

function barChart(containerId, categories, series, opts){
  opts = opts||{}; const W=measuredChartWidth(containerId, opts.width||520), H=opts.height||240;
  const min = opts.min!==undefined?opts.min:0, max = opts.max!==undefined?opts.max:100;
  // Long/many category labels overlap when centered horizontally under narrow bar groups —
  // rotate them and give the axis more room instead.
  const rotateLabels = opts.rotateLabels;
  const padL=38, padB=rotateLabels?96:34, padT=10, padR=10;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const groupW = plotW/categories.length;
  const barGap=6, nBars=series.length;
  const barW = Math.max(6,(groupW - barGap*(nBars+1))/nBars);
  const yScale = v => padT + plotH - (clamp(v,min,max)-min)/(max-min)*plotH;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="overflow:visible;font-family:inherit;">`;
  // gridlines
  [0,0.25,0.5,0.75,1].forEach(f=>{
    const y = padT+plotH*(1-f); const val = Math.round(min+f*(max-min));
    svg += svgEl('line',{x1:padL,y1:y,x2:W-padR,y2:y,stroke:'#EEF1F4','stroke-width':1});
    svg += `<text x="${padL-6}" y="${y+3}" font-size="9.5" text-anchor="end" fill="#8B93A1">${val}</text>`;
  });
  categories.forEach((cat,ci)=>{
    const gx = padL + ci*groupW;
    series.forEach((s,si)=>{
      const v = s.values[ci];
      if(v===null||v===undefined) return;
      const bx = gx + barGap + si*(barW+barGap);
      const by = yScale(v); const bh = padT+plotH-by;
      svg += svgEl('rect',{x:bx.toFixed(1),y:by.toFixed(1),width:barW.toFixed(1),height:bh.toFixed(1),rx:3,fill:s.color});
      svg += `<text x="${(bx+barW/2).toFixed(1)}" y="${(by-4).toFixed(1)}" font-size="10" text-anchor="middle" fill="#5B6472" font-weight="700">${fmt1(v)}</text>`;
    });
    if(rotateLabels){
      svg += `<text x="${(gx+groupW/2).toFixed(1)}" y="${(padT+plotH+14).toFixed(1)}" font-size="10" text-anchor="end" fill="#5B6472" transform="rotate(-40 ${(gx+groupW/2).toFixed(1)} ${(padT+plotH+14).toFixed(1)})">${escapeXml(cat)}</text>`;
    } else {
      svg += `<text x="${(gx+groupW/2).toFixed(1)}" y="${H-10}" font-size="10.5" text-anchor="middle" fill="#5B6472">${escapeXml(cat)}</text>`;
    }
  });
  svg += `</svg>`;
  document.getElementById(containerId).innerHTML = svg;
  renderLegend(containerId, series);
}
function renderLegend(containerId, series){
  const el = document.getElementById(containerId);
  const legendId = containerId+'-legend';
  let legend = document.getElementById(legendId);
  if(!legend){ legend = document.createElement('div'); legend.id = legendId; legend.className='legend-row'; el.parentNode.insertBefore(legend, el.nextSibling); }
  legend.innerHTML = series.map(s=>`<span><span class="legend-dot" style="background:${s.color}"></span>${escapeXml(s.name)}</span>`).join('');
}
function lineChart(containerId, labels, series, opts){
  opts=opts||{}; const W=measuredChartWidth(containerId, opts.width||520), H=opts.height||240;
  const min = opts.min!==undefined?opts.min:0, max = opts.max!==undefined?opts.max:100;
  const padL=38, padB=26, padT=10, padR=10;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const xScale = i => padL + (labels.length<=1?0:(i/(labels.length-1))*plotW);
  const yScale = v => padT + plotH - (clamp(v,min,max)-min)/(max-min)*plotH;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="overflow:visible;">`;
  [0,0.25,0.5,0.75,1].forEach(f=>{
    const y = padT+plotH*(1-f); const val = Math.round(min+f*(max-min));
    svg += svgEl('line',{x1:padL,y1:y,x2:W-padR,y2:y,stroke:'#EEF1F4','stroke-width':1});
    svg += `<text x="${padL-6}" y="${y+3}" font-size="9.5" text-anchor="end" fill="#8B93A1">${val}</text>`;
  });
  const tickEvery = Math.max(1, Math.floor(labels.length/6));
  labels.forEach((l,i)=>{ if(i%tickEvery===0) svg += `<text x="${xScale(i).toFixed(1)}" y="${H-8}" font-size="9" text-anchor="middle" fill="#8B93A1">${l.slice(5)}</text>`; });
  series.forEach(s=>{
    const pts = s.values.map((v,i)=> v===null? null : `${xScale(i).toFixed(1)},${yScale(v).toFixed(1)}`).filter(Boolean).join(' ');
    const attrs = {points:pts,fill:'none',stroke:s.color,'stroke-width':2,'stroke-linejoin':'round'};
    if(s.dash) attrs['stroke-dasharray']=s.dash;
    svg += svgEl('polyline',attrs);
  });
  svg += `</svg>`;
  document.getElementById(containerId).innerHTML = svg;
  renderLegend(containerId, series);
}
function escapeXml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt1(v){ if(v===null||v===undefined) return '—'; return (Math.round(v*10)/10).toFixed(1); }
function heatColor(v,min=0,max=100){ const pct=clamp((v-min)/(max-min),0,1); return `rgba(${Math.round(210-pct*150)},${Math.round(90+pct*110)},95,0.18)`; }
function heatText(v,min=0,max=100){ const pct=clamp((v-min)/(max-min),0,1); return pct>0.6? '#2E6B44' : pct>0.35? '#8A6A1E':'#A03A3A'; }
function sentColor(v){ const pct=clamp((v+100)/200,0,1); const r=Math.round(210-pct*160), g=Math.round(80+pct*130); return `rgb(${r},${g},95)`; }

/* ============================================================================
   2.5 CUSTOM DROPDOWN COMPONENT — visually replaces native <select> elements.
   The native <select> stays in the DOM (visually hidden) as the real source of
   truth: every existing piece of code that reads .value / .selectedOptions or
   listens for 'change' keeps working completely unmodified. This function is
   called once after all pages are built, and can be called again (harmlessly —
   already-enhanced selects are skipped) if a page ever adds new filterbars.
   ============================================================================ */
function escXHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escXAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
function enhanceSelects(root){
  (root||document).querySelectorAll('.filterbar select').forEach(sel=>{
    if(sel.dataset.xselDone) return;
    sel.dataset.xselDone = '1';
    buildXSel(sel);
  });
}
function refreshXSel(sel){
  const wrap = sel.closest('.xsel');
  if(wrap && wrap._xsel) wrap._xsel.renderAll();
}
function buildXSel(sel){
  const multiple = sel.multiple;
  const wrap = document.createElement('div');
  wrap.className = 'xsel';
  sel.classList.add('xsel-native');
  sel.parentNode.insertBefore(wrap, sel);
  wrap.appendChild(sel);
  const trigger = document.createElement('div');
  trigger.className = 'xsel-trigger'; trigger.tabIndex = 0;
  trigger.innerHTML = `<span class="xsel-trigger-label"></span><span class="xsel-badge" style="display:none;"></span><span class="xsel-chevron"></span>`;
  wrap.appendChild(trigger);
  const panel = document.createElement('div');
  panel.className = 'xsel-panel';
  wrap.appendChild(panel);
  let searchTerm = '';
  const opts = () => Array.from(sel.options).map(o=>({value:o.value, label:o.textContent, selected:o.selected}));
  const selectedOpts = () => opts().filter(o=>o.selected);
  function labelFor(){
    const so = selectedOpts();
    if(multiple){
      if(!so.length) return {text:'All', placeholder:true};
      if(so.length===1) return {text:so[0].label, placeholder:false};
      return {text:so.length+' selected', placeholder:false};
    }
    if(!so.length) return {text:'—', placeholder:true};
    return {text:so[0].label, placeholder:false};
  }
  function renderTrigger(){
    const {text,placeholder} = labelFor();
    const lbl = trigger.querySelector('.xsel-trigger-label');
    lbl.textContent = text; lbl.classList.toggle('placeholder', placeholder);
    const badge = trigger.querySelector('.xsel-badge');
    if(multiple && selectedOpts().length>1){ badge.style.display=''; badge.textContent = selectedOpts().length; }
    else badge.style.display='none';
  }
  function renderChips(){
    let chipsEl = wrap.querySelector('.xsel-chips');
    if(!multiple){ if(chipsEl) chipsEl.remove(); return; }
    const so = selectedOpts();
    if(!chipsEl){ chipsEl = document.createElement('div'); chipsEl.className='xsel-chips'; wrap.appendChild(chipsEl); }
    if(!so.length){ chipsEl.innerHTML=''; return; }
    const shown = so.slice(0,3);
    let html = shown.map(o=>`<span class="xsel-chip" data-val="${escXAttr(o.value)}"><span class="xsel-chip-label">${escXHtml(o.label)}</span><span class="xsel-chip-x">✕</span></span>`).join('');
    if(so.length>shown.length) html += `<span class="xsel-chip-more">+${so.length-shown.length} more</span>`;
    chipsEl.innerHTML = html;
    chipsEl.querySelectorAll('.xsel-chip-x').forEach(x=>x.addEventListener('click', e=>{ e.stopPropagation(); toggleVal(x.closest('.xsel-chip').dataset.val, false); }));
  }
  function toggleVal(val, forceState){
    const o = Array.from(sel.options).find(oo=>oo.value===val);
    if(!o) return;
    if(multiple){ o.selected = (forceState!==undefined) ? forceState : !o.selected; }
    else { Array.from(sel.options).forEach(oo=>oo.selected=false); o.selected = true; }
    sel.dispatchEvent(new Event('change',{bubbles:true}));
    renderAll();
    if(!multiple) close();
  }
  function renderPanel(){
    const term = searchTerm.trim().toLowerCase();
    const all = opts();
    const filtered = term? all.filter(o=>o.label.toLowerCase().includes(term)) : all;
    let inner = '';
    if(all.length>7) inner += `<div class="xsel-search"><input type="text" placeholder="Search…" value="${escXAttr(searchTerm)}"></div>`;
    if(multiple) inner += `<div class="xsel-actions"><button data-act="all">Select all</button><button data-act="clear">Clear</button></div>`;
    if(!filtered.length) inner += `<div class="xsel-empty">No matches</div>`;
    else inner += `<div class="xsel-list">` + filtered.map(o=>`
        <div class="xsel-opt ${o.selected?'selected':''}" data-val="${escXAttr(o.value)}">
          ${multiple? `<span class="xsel-check"><svg viewBox="0 0 10 10"><path d="M1 5l2.7 2.7L9 2" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>` : ''}
          <span class="xsel-opt-label">${escXHtml(o.label)}</span>
        </div>`).join('') + `</div>`;
    panel.innerHTML = inner;
    const inp = panel.querySelector('.xsel-search input');
    if(inp){ inp.addEventListener('input', e=>{ searchTerm=e.target.value; renderPanel(); }); inp.addEventListener('click', e=>e.stopPropagation()); }
    const allBtn = panel.querySelector('[data-act="all"]');
    if(allBtn) allBtn.addEventListener('click', e=>{ e.stopPropagation(); filtered.forEach(o=>{ const oo=Array.from(sel.options).find(x=>x.value===o.value); if(oo) oo.selected=true; }); sel.dispatchEvent(new Event('change',{bubbles:true})); renderAll(); });
    const clearBtn = panel.querySelector('[data-act="clear"]');
    if(clearBtn) clearBtn.addEventListener('click', e=>{ e.stopPropagation(); Array.from(sel.options).forEach(oo=>oo.selected=false); sel.dispatchEvent(new Event('change',{bubbles:true})); renderAll(); });
    panel.querySelectorAll('.xsel-opt').forEach(row=>row.addEventListener('click', e=>{ e.stopPropagation(); toggleVal(row.dataset.val); }));
  }
  function renderAll(){ renderTrigger(); renderChips(); if(wrap.classList.contains('open')) renderPanel(); }
  function open(){
    document.querySelectorAll('.xsel.open').forEach(o=>{ if(o!==wrap) o.classList.remove('open'); });
    wrap.classList.add('open'); searchTerm=''; renderPanel();
    const r = wrap.getBoundingClientRect();
    wrap.classList.toggle('panel-right', r.left > window.innerWidth - 300);
    setTimeout(()=>{ const inp=panel.querySelector('.xsel-search input'); if(inp) inp.focus(); },0);
  }
  function close(){ wrap.classList.remove('open'); }
  trigger.addEventListener('click', e=>{ e.stopPropagation(); wrap.classList.contains('open')? close() : open(); });
  trigger.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); wrap.classList.contains('open')?close():open(); } if(e.key==='Escape') close(); });
  document.addEventListener('click', e=>{ if(!wrap.contains(e.target)) close(); });
  wrap._xsel = {renderAll};
  renderAll();
}

/* ============================================================================
   2.6 COLLAPSED FILTER BAR — retrofits an existing, already-wired .filterbar
   into a compact "Filters" trigger + active-chip row + grouped popover, with
   zero changes to any page's filter LOGIC. Date-range fitems (usually 1-2 per
   bar and already compact) stay visible inline; everything select-based moves
   into the popover. Call after enhanceSelects() has styled the selects inside.
   ============================================================================ */
const FUNNEL_SVG = `<svg viewBox="0 0 20 20" fill="none"><path d="M2 4h16l-6 7v5l-4 2v-7L2 4z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
function collapseAllFilterbars(root){
  (root||document).querySelectorAll('.filterbar').forEach(bar=>{ if(!bar.dataset.fbarDone) collapseFilterbar(bar); });
}
function collapseFilterbar(bar){
  bar.dataset.fbarDone = '1';
  const allFitems = Array.from(bar.querySelectorAll(':scope > .fitem'));
  const dateFitems = allFitems.filter(fi=>fi.querySelector('input[type=date]'));
  const searchFitems = allFitems.filter(fi=>fi.querySelector('input[type=text]'));
  const selectFitems = allFitems.filter(fi=>fi.querySelector('select'));
  const checkboxFitems = allFitems.filter(fi=>!fi.querySelector('input[type=date]') && !fi.querySelector('input[type=text]') && !fi.querySelector('select') && fi.querySelector('input[type=checkbox]'));
  const otherNodes = Array.from(bar.children).filter(c=>!allFitems.includes(c) && !c.classList.contains('spacer'));
  if(!selectFitems.length && !checkboxFitems.length){ return; } // nothing worth collapsing (e.g. narrative extra's candidate-only bar stays as-is if ever routed here)

  const panel = document.createElement('div'); panel.className = 'fbar-panel';
  const grid = document.createElement('div'); grid.className = 'fbar-panel-grid';
  selectFitems.forEach(fi=>grid.appendChild(fi));
  checkboxFitems.forEach(fi=>grid.appendChild(fi));
  panel.appendChild(grid);
  const foot = document.createElement('div'); foot.className='fbar-panel-foot';
  const doneBtn = document.createElement('button'); doneBtn.className='btn sm'; doneBtn.textContent='Done'; doneBtn.type='button';
  foot.appendChild(doneBtn); panel.appendChild(foot);

  const trigger = document.createElement('button'); trigger.type='button'; trigger.className='fbar-trigger';
  trigger.innerHTML = `${FUNNEL_SVG}<span>Filters</span><span class="fbar-count" style="display:none;"></span>`;
  const chipRow = document.createElement('div'); chipRow.className='fbar-chips';
  const resetBtn = document.createElement('button'); resetBtn.type='button'; resetBtn.className='fbar-reset'; resetBtn.textContent='Reset'; resetBtn.style.display='none';
  const dateWrap = document.createElement('div'); dateWrap.className='fbar-dates';
  dateFitems.forEach(fi=>dateWrap.appendChild(fi));
  const searchWrap = document.createElement('div'); searchWrap.className='fbar-search';
  searchFitems.forEach(fi=>searchWrap.appendChild(fi));

  // Chips + reset share their own full-width flex line (via CSS flex-basis:100%) instead of
  // competing for leftover space next to search/dates/trigger — a long chip value (e.g. a full
  // race name) was getting squeezed into whatever space happened to be left and visually spilling
  // past the card edge instead of wrapping cleanly onto its own row.
  const chipLine = document.createElement('div'); chipLine.className='fbar-chipline';
  chipLine.appendChild(chipRow); chipLine.appendChild(resetBtn);

  const head = document.createElement('div'); head.className='fbar-head';
  if(searchFitems.length) head.appendChild(searchWrap);
  head.appendChild(trigger);
  if(dateFitems.length) head.appendChild(dateWrap);
  head.appendChild(chipLine);
  otherNodes.forEach(n=>head.appendChild(n)); // preserve any stray action buttons/labels

  bar.innerHTML = '';
  bar.classList.add('fbar');
  bar.appendChild(head);
  bar.appendChild(panel);

  function fieldLabel(fi){ const l = fi.querySelector('label'); return l? l.textContent : ''; }
  function isDefaultSel(sel){ return sel.multiple ? sel.selectedOptions.length===0 : (sel.value==='all'||sel.value===''); }
  function summarySel(sel){
    if(sel.multiple){
      const so = Array.from(sel.selectedOptions);
      return so.length===1 ? so[0].textContent : so.length+' selected';
    }
    const o = sel.options[sel.selectedIndex];
    return o ? o.textContent : sel.value;
  }
  function resetSel(sel){
    if(sel.multiple) Array.from(sel.options).forEach(o=>o.selected=false);
    else { const a = Array.from(sel.options).find(o=>o.value==='all'); sel.value = a? 'all' : (sel.options[0]?sel.options[0].value:''); }
    sel.dispatchEvent(new Event('change',{bubbles:true}));
  }
  function render(){
    const active = selectFitems.map(fi=>({fi, sel:fi.querySelector('select'), label:fieldLabel(fi)})).filter(m=>!isDefaultSel(m.sel));
    const badge = trigger.querySelector('.fbar-count');
    if(active.length){ badge.style.display=''; badge.textContent = active.length; } else badge.style.display='none';
    resetBtn.style.display = active.length? '' : 'none';
    chipRow.innerHTML = active.map((m,i)=>`<span class="fbar-chip" data-i="${i}"><b>${escXHtml(m.label)}:</b><span class="fbar-chip-txt">${escXHtml(summarySel(m.sel))}</span><span class="fbar-chip-x">✕</span></span>`).join('');
    chipRow.querySelectorAll('.fbar-chip-x').forEach(x=>x.addEventListener('click', e=>{ e.stopPropagation(); resetSel(active[+x.closest('.fbar-chip').dataset.i].sel); }));
  }
  trigger.addEventListener('click', e=>{
    e.stopPropagation();
    const opening = !bar.classList.contains('open');
    document.querySelectorAll('.fbar.open').forEach(b=>{ if(b!==bar) b.classList.remove('open'); });
    bar.classList.toggle('open', opening);
    if(opening) selectFitems.forEach(fi=>{ const s=fi.querySelector('select'); if(s) refreshXSel(s); });
  });
  doneBtn.addEventListener('click', e=>{ e.stopPropagation(); bar.classList.remove('open'); });
  resetBtn.addEventListener('click', e=>{ e.stopPropagation(); selectFitems.forEach(fi=>{ const s=fi.querySelector('select'); if(s && !isDefaultSel(s)) resetSel(s); }); });
  document.addEventListener('click', e=>{ if(!bar.contains(e.target)) bar.classList.remove('open'); });
  bar.addEventListener('change', render);
  render();
}

/* Real per-day bucket share for one entity/dimension — replaces the mockup's synthetic
   smooth-curve-based version. Visibility/Favorability are prompt-level percentages (averaged
   across that day's prompts); Depth/Accuracy/Narrative/Consistency are literal per-response 0/1/2
   counts for that day. */
function dailyBucketShare(entityId, dim, dayIdx, modelFilter){
  const zero = dim==='visibility' ? {'0':0,'1':0} : dim==='favorability' ? {pos:0,neu:0,neg:0} : {'0':0,'1':0,'2':0};
  const ent = entityById(entityId);
  const d = DATES[dayIdx];
  if(!ent || d===undefined) return zero;
  const side = ent.role==='ours' ? 'candidate' : 'opponent';
  let dayRows = aggRowsCache.filter(r=>r.race===ent.race && r.report_date===d);
  if(modelFilter) dayRows = dayRows.filter(r=>r.ai_provider===MODEL_TO_PROVIDER[modelFilter]);
  if(dim==='favorability'){
    const pos=[], neu=[], neg=[];
    dayRows.forEach(r=>{ const p=r['prompt_level_favorability_pct_positive_'+side]; if(p!==''&&p!=null){ pos.push(+p); neu.push(+r['prompt_level_favorability_pct_neutral_'+side]); neg.push(+r['prompt_level_favorability_pct_negative_'+side]); } });
    if(!pos.length) return zero;
    return {pos:avg(pos), neu:avg(neu), neg:avg(neg)};
  }
  if(dim==='visibility'){
    const vals = dayRows.map(r=>r['prompt_level_visibility_score_'+side]).filter(v=>v!==''&&v!=null).map(Number);
    if(!vals.length) return zero;
    const one = avg(vals);
    return {'1':one, '0':100-one};
  }
  const field = dim==='narrative' ? 'narrative_alignment_score_'+side : dim+'_score_'+side;
  const vals = dayRows.map(r=>r[field]).filter(v=>v!==''&&v!=null);
  if(!vals.length) return zero;
  const total = vals.length;
  return {'0':100*vals.filter(v=>v==='0').length/total, '1':100*vals.filter(v=>v==='1').length/total, '2':100*vals.filter(v=>v==='2').length/total};
}

function avg(arr){ const v=arr.filter(x=>x!==null&&x!==undefined&&!Number.isNaN(x)); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null; }
function stddev(arr){ const v=arr.filter(x=>x!==null&&x!==undefined&&!Number.isNaN(x)); if(v.length<2) return 0; const m=avg(v); return Math.sqrt(avg(v.map(x=>(x-m)*(x-m)))); }
function pctScored2(rows, field){
  const vals = rows.map(r=>r[field]).filter(v=>v!==''&&v!==null&&v!==undefined);
  if(!vals.length) return null;

}

function buildMetrics(){
  METRICS = {};
  ENTITIES.forEach(e=>{
    const rows = rowsForEntity(e);
    const side = e.role==='ours' ? 'candidate' : 'opponent';

    const promptLevelVis = {}, promptLevelFav = {};
    rows.forEach(r=>{
      const vis = r['prompt_level_visibility_score_'+side];
      if(vis!=='' && vis!=null) promptLevelVis[r.prompt_id] = +vis;
      const pos = r['prompt_level_favorability_pct_positive_'+side], neg = r['prompt_level_favorability_pct_negative_'+side];
      if(pos!=='' && pos!=null) promptLevelFav[r.prompt_id] = (+pos) - (+neg);
    });
    const base = {
      visibility: avg(Object.values(promptLevelVis)),
      favorability: avg(Object.values(promptLevelFav)),
      depth: pctScored2(rows, 'depth_score_'+side),
      accuracy: pctScored2(rows, 'accuracy_score_'+side),
      narrative: pctScored2(rows, 'narrative_alignment_score_'+side),
      consistency: pctScored2(rows, 'consistency_score_'+side)
    };

    const history = {};
    DIM_KEYS.forEach(dim=>{
      history[dim] = DATES.map(d=>{
        const dayRows = rows.filter(r=>r.report_date===d);
        if(dim==='visibility'){
          const vals = dayRows.map(r=>r['prompt_level_visibility_score_'+side]).filter(v=>v!==''&&v!=null).map(Number);
          return avg(vals);
        }
        if(dim==='favorability'){
          const vals = dayRows.map(r=>{ const p=r['prompt_level_favorability_pct_positive_'+side], n=r['prompt_level_favorability_pct_negative_'+side]; return (p!==''&&p!=null)? (+p-+n) : null; });
          return avg(vals);
        }
        const field = dim==='narrative' ? 'narrative_alignment_score_'+side : dim+'_score_'+side;
        return pctScored2(dayRows, field);
      });
    });

    const accVals = rows.map(r=>r['accuracy_score_'+side]).filter(v=>v!==''&&v!=null);
    const n2=accVals.filter(v=>v==='2').length, n1=accVals.filter(v=>v==='1').length, n0=accVals.filter(v=>v==='0').length;

    const topicCounts = {};
    rows.forEach(r=>{ const t=r['key_topics_'+side+'_rolled_up']; if(t) t.split('|').forEach(x=>{ topicCounts[x]=(topicCounts[x]||0)+1; }); });
    const core = coreTopicsForParty(e.party);
    const topics = Object.entries(topicCounts).map(([topic,count])=>({topic, core: core.includes(topic), count})).sort((a,b)=>b.count-a.count);

    const gapCounts = {}; let gapDenom = 0;
    rows.forEach(r=>{ const k=r.id+'|'+side; const gaps = NARR_GAPS_BY_ROW[k]; if(gaps){ gapDenom++; gaps.forEach(t=>{ gapCounts[t]=(gapCounts[t]||0)+1; }); } });
    const gaps = Object.entries(gapCounts).map(([topic,n])=>({topic, pctMissing: gapDenom? Math.round(100*n/gapDenom): 0})).sort((a,b)=>b.pctMissing-a.pctMissing);

    METRICS[e.id] = {base, history, accCounts:{0:n0,1:n1,2:n2,total:accVals.length}, topics, gaps, coreTopics: core};
  });

const WEIGHTS = {visibility:0.40,favorability:0.15,depth:0.15,accuracy:0.15,narrative:0.15};
function composite(e){
  const m=METRICS[e.id].base;
  const favN = m.favorability!=null? (m.favorability+100)/2 : null;
  const parts=[[m.visibility,WEIGHTS.visibility],[favN,WEIGHTS.favorability],[m.depth,WEIGHTS.depth],[m.accuracy,WEIGHTS.accuracy],[m.narrative,WEIGHTS.narrative]];
  const known = parts.filter(([v])=>v!=null);
  if(!known.length) return null;
  const wsum = known.reduce((a,[,w])=>a+w,0);
  return known.reduce((a,[v,w])=>a+v*w,0)/wsum;
}

/* ---- real per-run lookup, replacing the old RNG-based getRun() — same output shape.
   Returns null when no real run exists for this prompt+model+date (real data is sparser than
   the old synthetic 45-day grid) — callers must handle a null run. ---- */
function getRun(prompt, model, dateStr){
  const provider = MODEL_TO_PROVIDER[model];
  const row = RUN_INDEX[prompt.id+'|'+provider+'|'+dateStr];
  if(!row) return null;
  const opp = oppEntity(prompt.raceIdx);
  function sideScores(side){
    const out = {};
    DIM_KEYS.forEach(dim=>{
      if(dim==='visibility'){ const v=row['visibility_score_'+side]; out.visibility = (v!==''&&v!=null) ? (+v>=50?1:0) : null; return; }
      if(dim==='favorability'){ const v=row['favorability_pct_positive_'+side]; out.favorability = (v!==''&&v!=null) ? (+v - +row['favorability_pct_negative_'+side]) : null; return; }
      const field = dim==='narrative' ? 'narrative_alignment_score_'+side : dim+'_score_'+side;
      const v = row[field];
      out[dim] = (v!==''&&v!=null) ? +v : null;
    });
    return out;
  }
  const oursSide = sideScores('candidate');
  const oppSide = opp ? sideScores('opponent') : {};
  const accIssue = { ours: (ACC_ISSUES_BY_ROW[row.id+'|candidate']||[])[0]||null, opp: opp? (ACC_ISSUES_BY_ROW[row.id+'|opponent']||[])[0]||null : null };
  const missingTopics = { ours: NARR_GAPS_BY_ROW[row.id+'|candidate']||[], opp: opp? (NARR_GAPS_BY_ROW[row.id+'|opponent']||[]) : [] };
  return { model, date: dateStr, scores:{ours:oursSide, opp:oppSide}, accIssue, missingTopics,
           response: (TEXT[row.id] && TEXT[row.id].full_response) || '', _row: row };
}

/* Real data is sparse — a given (prompt, model) typically has a real run on exactly ONE date, not
   every date in a range. Looking up only "the latest date in range" (the original mockup's
   pattern, fine for its dense synthetic data) silently drops most real rows and makes the date
   range filter look like it does nothing. This scans the whole range and returns whichever real
   run exists (there's normally at most one) — the correct replacement for that pattern everywhere
   a prompt-fanout-style table is built. */
function getRunInRange(prompt, model, i0, i1){
  for(let i=i1; i>=i0; i--){
    const run = getRun(prompt, model, DATES[i]);
    if(run) return run;
  }
  return null;
}

/* ---- refusal / hypothesis-alignment lookup, replacing getHealthRun() — real is_refusal /
   response_tests_hypothesis, same output shape. ---- */
function getHealthRun(p, m, d){
  const provider = MODEL_TO_PROVIDER[m];
  const row = RUN_INDEX[p.id+'|'+provider+'|'+d];
  if(!row) return null;
  const refused = row.is_refusal === 'Y';
  const alignment = refused ? null : (row.response_tests_hypothesis || null);
  return {refused, alignment};
}

/* ============================================================================
   3.7 HORIZONTAL 100% STACKED BAR — reusable across Prompt Health (alignment
   breakdown per category) and Citation Breakout (category composition).
   ============================================================================ */
function stackedBarChart(containerId, rows, opts){
  opts = opts||{};
  const W=measuredChartWidth(containerId, opts.width||640), barH=opts.barH||24, rowGap=opts.rowGap||12, labelW=opts.labelW||150, padR=6, padT=6;
  const H = padT + rows.length*(barH+rowGap);
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="overflow:visible;font-family:inherit;">`;
  const plotW = W-labelW-padR;
  rows.forEach((row,ri)=>{
    const total = row.segments.reduce((a,s)=>a+s.value,0)||1;
    const y = padT + ri*(barH+rowGap);
    svg += `<text x="0" y="${(y+barH/2+4).toFixed(1)}" font-size="11" fill="var(--ink)" font-weight="600">${escXHtml(row.label)}</text>`;
    // Same clip-to-rounded-rect treatment as verticalStackedBarChart — square segments inside a
    // rounded outer shape, instead of every segment individually rounded (which left white gaps
    // at internal boundaries).
    const clipId = `hsclip-${containerId}-${ri}`;
    svg += `<clipPath id="${clipId}"><rect x="${labelW}" y="${y.toFixed(1)}" width="${plotW}" height="${barH}" rx="4"/></clipPath><g clip-path="url(#${clipId})">`;
    let x = labelW;
    row.segments.forEach(seg=>{
      const w = plotW*(seg.value/total);
      if(w>0.4){
        svg += svgEl('rect',{x:x.toFixed(1),y:y.toFixed(1),width:w.toFixed(1),height:barH,fill:seg.color});
        if(w>28) svg += `<text x="${(x+w/2).toFixed(1)}" y="${(y+barH/2+4).toFixed(1)}" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="700">${Math.round(100*seg.value/total)}%</text>`;
      }
      x += w;
    });
    svg += `</g>`;
    svg += svgEl('rect',{x:labelW,y:y.toFixed(1),width:plotW,height:barH,rx:4,fill:'none',stroke:'#DFE4EA','stroke-width':1});
  });
  svg += '</svg>';
  document.getElementById(containerId).innerHTML = svg;
}
/* Vertical counterpart to stackedBarChart — one upright 100%-stacked column per row, segments
   stacked bottom-to-top in the given order, row label + total beneath the x-axis. */
function verticalStackedBarChart(containerId, rows, opts){
  opts = opts||{};
  const W = measuredChartWidth(containerId, opts.width||520), H = opts.height||260;
  const padT=10, padB=40, padL=30, padR=10;
  const plotH = H-padT-padB, plotW = W-padL-padR;
  const barW = Math.min(90, plotW/(rows.length*2));
  const gap = (plotW - barW*rows.length)/(rows.length+1);
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="overflow:visible;font-family:inherit;">`;
  // gridlines at 0/25/50/75/100%
  [0,25,50,75,100].forEach(pct=>{
    const y = padT + plotH*(1-pct/100);
    svg += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#EEF1F5" stroke-width="1"/>`;
    svg += `<text x="${padL-6}" y="${(y+3).toFixed(1)}" font-size="9.5" text-anchor="end" fill="var(--ink-soft)">${pct}</text>`;
  });
  rows.forEach((row,ri)=>{
    // row.total lets a caller pass the TRUE population size when it renders fewer segments than
    // buckets exist (e.g. Visibility only draws the "mentioned" segment) — without it, percentages
    // would be computed against just the drawn segments' own sum, always reading 100%.
    const total = (row.total!=null ? row.total : row.segments.reduce((a,s)=>a+s.value,0))||1;
    const x = padL + gap + ri*(barW+gap);
    // Clip the whole bar to one rounded rect, then draw square-cornered segments inside it —
    // rounding each segment individually left visible white gaps at every internal boundary
    // where two rounded corners met instead of a flush edge.
    const clipId = `vsclip-${containerId}-${ri}`;
    svg += `<clipPath id="${clipId}"><rect x="${x.toFixed(1)}" y="${padT}" width="${barW.toFixed(1)}" height="${plotH.toFixed(1)}" rx="4"/></clipPath><g clip-path="url(#${clipId})">`;
    let yTop = padT+plotH;
    row.segments.forEach(seg=>{
      const h = plotH*(seg.value/total);
      const y = yTop-h;
      if(h>0.4){
        svg += svgEl('rect',{x:x.toFixed(1),y:y.toFixed(1),width:barW.toFixed(1),height:h.toFixed(1),fill:seg.color});
        if(h>20) svg += `<text x="${(x+barW/2).toFixed(1)}" y="${(y+h/2+4).toFixed(1)}" font-size="10.5" text-anchor="middle" fill="#fff" font-weight="700">${Math.round(100*seg.value/total)}%</text>`;
      }
      yTop -= h;
    });
    svg += `</g>`;
    svg += svgEl('rect',{x:x.toFixed(1),y:padT,width:barW.toFixed(1),height:plotH,rx:4,fill:'none',stroke:'#DFE4EA','stroke-width':1});
    svg += `<text x="${(x+barW/2).toFixed(1)}" y="${(padT+plotH+16).toFixed(1)}" font-size="11" text-anchor="middle" fill="var(--ink)" font-weight="600">${escXHtml(row.label)}</text>`;
  });
  svg += '</svg>';
  document.getElementById(containerId).innerHTML = svg;
}

/* ============================================================================
   6. SHARED COMPONENT: race-level table with gap sort + fanout drill-in
   ============================================================================ */
function computeRaceRows(dimKey, filters){
  let idxs = ROSTER.map((r,i)=>i);
  if(filters.state && filters.state!=='all') idxs = idxs.filter(i=>ROSTER[i].state===filters.state);
  if(filters.office && filters.office!=='all') idxs = idxs.filter(i=>ROSTER[i].office===filters.office);
  if(filters.level && filters.level!=='all') idxs = idxs.filter(i=>ROSTER[i].race_level===filters.level);
  if(filters.search && filters.search.trim()){
    const q = filters.search.trim().toLowerCase();
    idxs = idxs.filter(i=>{ const r=ROSTER[i]; return r.name.toLowerCase().includes(q) || (r.opponent&&r.opponent.toLowerCase().includes(q)) || r.race.toLowerCase().includes(q); });
  }
  return idxs.map(i=>{
    const ours = ourEntity(i), opp = oppEntity(i);
    let ourVal, oppVal, gap;
    if(dimKey==='favorability'){
      // Net favorability (% positive − % negative), not % negative alone — higher is better,
      // same convention as every other dimension.
      ourVal = METRICS[ours.id].base.favorability;
      oppVal = opp? METRICS[opp.id].base.favorability : null;
      gap = (oppVal!==null && ourVal!==null) ? oppVal-ourVal : null; // positive = opponent's net favorability ahead of ours
    } else {
      if(dimKey==='accuracy'){ ourVal = METRICS[ours.id].accCounts.total? 100*METRICS[ours.id].accCounts[2]/METRICS[ours.id].accCounts.total : null; oppVal = opp? (METRICS[opp.id].accCounts.total? 100*METRICS[opp.id].accCounts[2]/METRICS[opp.id].accCounts.total : null) : null; }
      else if(dimKey==='composite'){ ourVal = composite(ours); oppVal = opp? composite(opp): null; }
      else { ourVal = METRICS[ours.id].base[dimKey]; oppVal = opp? METRICS[opp.id].base[dimKey] : null; }
      gap = (oppVal!==null && ourVal!==null) ? oppVal-ourVal : null;
    }
    return {raceIdx:i, ours, opp, ourVal, oppVal, gap};
  });
}
function renderRaceTable(containerId, dimKey, filters, opts){
  opts = opts||{};
  const isFav = dimKey==='favorability';
  const rows = computeRaceRows(dimKey, filters).sort((a,b)=>{
    const av = a.gap===null? -9999 : a.gap, bv = b.gap===null? -9999 : b.gap;
    return bv-av;
  });
  const showAllId = containerId+'-showall';
  const showAll = window.__showAllState && window.__showAllState[containerId];
  const shown = showAll ? rows : rows.slice(0,15);
  const range = DIM_RANGE[dimKey]||[0,100];
  const heat=(v)=> v===null? '<span class="small-muted">—</span>' : `<span class="heat" style="background:${heatColor(v,range[0],range[1])};color:${heatText(v,range[0],range[1])}">${v>0&&isFav?'+':''}${fmt1(v)}</span>`;
  let html = `<table><tr><th>Race</th><th>State</th><th>Office</th><th>${isFav?'Our net favorability':'Our score'}</th><th>${isFav?'Opponent net favorability':'Opponent score'}</th><th>Gap</th></tr>`;
  shown.forEach(r=>{
    html += `<tr class="clickable" onclick="toggleFanoutRow('${containerId}', ${r.raceIdx}, '${dimKey}')" data-racerow="${containerId}-${r.raceIdx}">
      <td><b>${r.ours.name}</b><br><span class="small-muted">${escapeXml(r.ours.race)}</span></td>
      <td>${r.ours.state}</td><td class="small-muted">${r.ours.office}</td>
      <td>${heat(r.ourVal)}</td><td>${heat(r.oppVal)}</td>
      <td class="${r.gap>0?'gap-pos':r.gap<0?'gap-neg':''}">${r.gap===null?'—':(r.gap>0?'+':'')+fmt1(r.gap)}</td></tr>
      <tr id="fanoutrow-${containerId}-${r.raceIdx}" style="display:none;"><td colspan="6" style="padding:0;border-bottom:none;"><div id="fanoutbody-${containerId}-${r.raceIdx}"></div></td></tr>`;
  });
  html += `</table>`;
  document.getElementById(containerId).innerHTML = html;
  const moreWrap = document.getElementById(containerId+'-more');
  if(moreWrap) moreWrap.innerHTML = rows.length>15 ? `<button class="btn ghost sm" onclick="toggleShowAll('${containerId}','${dimKey}', ${JSON.stringify(filters).replace(/"/g,'&quot;')})">${showAll? 'Show top 15 only' : 'Show all '+rows.length+' races'}</button><span class="small-muted"> &nbsp;${rows.length} races match current filters, sorted by biggest gap first.</span>` : `<span class="small-muted">${rows.length} races match current filters.</span>`;
}
window.__showAllState = {};
function toggleShowAll(containerId, dimKey, filters){
  window.__showAllState[containerId] = !window.__showAllState[containerId];
  renderRaceTable(containerId, dimKey, filters);
}
function toggleFanoutRow(containerId, raceIdx, dimKey){
  const rowEl = document.getElementById(`fanoutrow-${containerId}-${raceIdx}`);
  const bodyEl = document.getElementById(`fanoutbody-${containerId}-${raceIdx}`);
  const isOpen = rowEl.style.display!=='none';
  // close any other open fanout in this table to keep it tidy
  document.querySelectorAll(`tr[id^="fanoutrow-${containerId}-"]`).forEach(el=>el.style.display='none');
  if(isOpen) return;
  rowEl.style.display='';
  bodyEl.innerHTML = renderFanoutHtml(raceIdx, dimKey);
}
function renderFanoutHtml(raceIdx, dimKey){
  const prompts = PROMPTS_BY_RACE[raceIdx]||[];
  const ours = ourEntity(raceIdx), opp = oppEntity(raceIdx);
  if(!prompts.length) return `<div class="fanout-wrap"><span class="small-muted">No sampled prompts available for this race.</span></div>`;
  // All real dates, not just the latest — real data is sparse (typically one real run per
  // prompt+model), so restricting to one date silently dropped almost everything.
  let rows = [];
  prompts.forEach(p=>{ MODELS.forEach(m=>{ const run=getRunInRange(p,m,0,DATES.length-1); if(run) rows.push({p, m, run}); }); });
  if(!rows.length) return `<div class="fanout-wrap"><span class="small-muted">No real runs found for this race.</span></div>`;
  // Sorted lowest to highest on "our" score for this dimension (worst-first, matches every other
  // "where is this falling short" framing in the dashboard).
  rows.sort((a,b)=>{
    const av=a.run.scores.ours[dimKey], bv=b.run.scores.ours[dimKey];
    if(av===null) return 1; if(bv===null) return -1;
    return av-bv;
  });
  const range = DIM_RANGE[dimKey]||[0,100];
  const heat=(v)=> v===null? '<span class="small-muted">—</span>' : `<span class="heat" style="background:${heatColor(v,range[0],range[1])};color:${heatText(v,range[0],range[1])}">${fmt1(v)}</span>`;
  let html = `<div class="fanout-wrap"><div class="fanout-head"><span>All prompt runs for <b>${ours.race}</b>, sorted lowest to highest ${DIM_LABELS[dimKey].toLowerCase()}</span><span class="small-muted">${rows.length} prompt × model runs</span></div>`;
  html += `<div class="scroll-table" style="max-height:320px;"><table><tr><th>Prompt</th><th>Model</th><th>Date</th><th>Our score</th><th>Opp. score</th><th>Gap</th>${dimKey==='accuracy'?'<th></th>':''}</tr>`;
  rows.forEach((r,ri)=>{
    const ov=r.run.scores.ours[dimKey], pv=r.run.scores.opp[dimKey];
    const gap = (ov!==null&&pv!==null)? pv-ov : null;
    const nonAccurate = dimKey==='accuracy' && (ov===0||ov===1||pv===0||pv===1);
    html += `<tr class="${nonAccurate?'clickable':''}" ${nonAccurate?`onclick="showAccuracyDetail(${raceIdx},'${r.p.id}','${r.m}','${r.run.date}')"`:''}>
      <td style="max-width:230px;white-space:normal;">${escapeXml(r.p.text)}<br><span class="small-muted">${r.p.category}</span></td>
      <td class="small-muted">${r.m}</td><td class="small-muted">${r.run.date}</td><td>${heat(ov)}</td><td>${heat(pv)}</td>
      <td class="${gap>0?'gap-pos':gap<0?'gap-neg':''}">${gap===null?'—':(gap>0?'+':'')+fmt1(gap)}</td>
      ${dimKey==='accuracy'?`<td>${nonAccurate?'<span class="tag recur" style="background:#FBEAEA;color:var(--bad);">view flag</span>':'<span class="small-muted">fully accurate</span>'}</td>`:''}
      </tr>`;
  });
  html += `</table></div></div>`;
  return html;
}
function showAccuracyDetail(raceIdx, promptId, model, date){
  const p = PROMPTS.find(x=>x.id===promptId);
  const run = getRun(p, model, date);
  if(!run) return;
  const ours = ourEntity(raceIdx), opp = oppEntity(raceIdx);
  const issue = run.accIssue.ours || run.accIssue.opp;
  const who = run.accIssue.ours? ours.name : (run.accIssue.opp? opp.name : null);
  openSidePanel(`
    <h3 style="margin-top:6px;">Accuracy flag detail</h3>
    <div class="small-muted" style="margin-bottom:10px;">${p.category} · ${model} · ${date}</div>
    <div class="run-detail"><b>Prompt:</b> ${escapeXml(p.text)}</div>
    ${who? `<div class="callout section-gap"><b>Flag on:</b> ${who}<br><b>Inaccurate statement:</b> ${escapeXml(issue.statement)}<br><b>Category:</b> ${ACCURACY_CATEGORIES.find(c=>c.key===issue.category)?.label||issue.category}<br><b>Why it's inaccurate:</b> ${escapeXml(issue.description)}</div>` : `<div class="callout section-gap">Partially accurate — no single flagged statement, but response left a specific error/omission versus the knowledge base.</div>`}
    <div class="section-gap"><button class="btn ghost sm" onclick="closeSidePanel()">Close</button></div>
  `);
}

function resolveEntitiesForFilters(f){
  if(f.race && f.race!=='all') return [parseInt(f.race,10)];
  let idxs = ROSTER.map((r,i)=>i);
  if(f.state && f.state!=='all') idxs = idxs.filter(i=>ROSTER[i].state===f.state);
  if(f.office && f.office!=='all') idxs = idxs.filter(i=>ROSTER[i].office===f.office);
  if(f.level && f.level!=='all') idxs = idxs.filter(i=>ROSTER[i].race_level===f.level);
  if(f.location && f.location!=='all') idxs = idxs.filter(i=>ROSTER[i].location===f.location);
  if(f.party && f.party!=='all') idxs = idxs.filter(i=>ROSTER[i].party===f.party);
  if(f.search && f.search.trim()){
    const q = f.search.trim().toLowerCase();
    idxs = idxs.filter(i=>{ const r=ROSTER[i]; return r.name.toLowerCase().includes(q) || (r.opponent&&r.opponent.toLowerCase().includes(q)) || r.race.toLowerCase().includes(q); });
  }
  return idxs;
}
function renderOverviewInsight(ours){
  const bodyEl = document.getElementById('ov-insight-body');
  if(!bodyEl) return;
  const bullets = [];
  if(ours.length){
    const bucketDims = ['visibility','favorability','depth','accuracy'];
    const dimShares = bucketDims.map(dim=>({dim, share: worstShare(dim, mergeBucketTotals(ours.map(e=>entityBucketTotals(e,dim))))})).filter(x=>x.share!==null);
    if(dimShares.length){
      dimShares.sort((a,b)=>b.share-a.share);
      const worstDim = dimShares[0];
      const worstLabel = bucket3Label(worstDim.dim, worstDim.dim==='favorability'?'neg':'0').toLowerCase();
      bullets.push(`${DIM_LABELS[worstDim.dim]} is the biggest opportunity across the ${ours.length} candidate${ours.length===1?'':'s'} in view — ${fmt1(worstDim.share)}% of scored responses are ${worstLabel}.`);
      const catAcc = categoryScoresAcrossEntities(ours, worstDim.dim);
      const catRows = Object.entries(catAcc).map(([cat,c])=>({cat,share:worstShare(worstDim.dim,c)})).filter(x=>x.share!==null).sort((a,b)=>b.share-a.share);
      if(catRows.length) bullets.push(`Within ${DIM_LABELS[worstDim.dim]}, ${categoryPlain(catRows[0].cat)} are the biggest driver (${fmt1(catRows[0].share)}% ${worstLabel}) — see the ${DIM_LABELS[worstDim.dim]} page for the specific responses and recommended fixes.`);
      if(dimShares.length>1){
        const secondBest = [...dimShares].sort((a,b)=>a.share-b.share)[0];
        bullets.push(`${DIM_LABELS[secondBest.dim]} is doing best by comparison (${fmt1(secondBest.share)}% ${bucket3Label(secondBest.dim, secondBest.dim==='favorability'?'neg':'0').toLowerCase()}).`);
      }
    }
    const narrAvg = avg(ours.map(e=>METRICS[e.id].base.narrative));
    if(narrAvg!==null && narrAvg<60) bullets.push(`Narrative Alignment also averages a modest ${fmt1(narrAvg)}/100 — check the Narrative Alignment page's topic explorer for the specific themes going missing.`);
  }
  bodyEl.innerHTML = bullets.length? `<ul class="insight-list">${bullets.map(b=>`<li>${b}</li>`).join('')}</ul>` : `<div class="small-muted">Not enough data in the current filter to generate insights.</div>`;
}

function levenshtein(a, b){
  a=a.toLowerCase(); b=b.toLowerCase();
  const m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1},(_, j)=>j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      cur[j] = a[i-1]===b[j-1] ? prev[j-1] : 1+Math.min(prev[j-1],prev[j],cur[j-1]);
    }
    prev = cur;
  }
  return prev[n];
}
/* Candidate/opponent-name OR race-label search, resolves to a race (setting the Race select) so
   the rest of the filter/render logic — already keyed on "is a single race selected?" — needs no
   separate code path. Tolerant of small typos (edit distance) since an exact-match-only search
   silently fails on any typo and leaves whatever race was previously selected showing, with no
   indication the search didn't do anything (a real bug reported 2026-08-27: searching "John
   LeSeur" — missing a letter from the real "John LeSueur" — silently left Jorge Lozano's race,
   LeSueur's own opponent, on screen from an earlier selection). */
function resolveSearchToRaceIdx(query){
  const q = query.trim();
  if(!q) return null;
  const qLower = q.toLowerCase();
  const candidates = ALL_RACES.flatMap(r=>{
    const ros = ROSTER[r.idx];
    const names = [ros.name];
    if(ros.opponent) names.push(ros.opponent);
    names.push(r.label);
    return names.map(name=>({name, raceIdx:r.idx}));
  });
  const exact = candidates.find(c=>c.name.toLowerCase()===qLower);
  if(exact) return exact.raceIdx;
  // Fuzzy fallback: smallest edit distance, only accepted if "close enough" relative to length
  // (avoids matching two totally different short names to each other).
  let best=null, bestDist=Infinity;
  candidates.forEach(c=>{
    const d = levenshtein(qLower, c.name.toLowerCase());
    if(d<bestDist){ bestDist=d; best=c; }
  });
  const threshold = Math.max(1, Math.floor(qLower.length*0.2));
  return (best && bestDist<=threshold) ? best.raceIdx : null;
}
function wireCandidateSearch(prefix, onChange){
  const input = document.getElementById(prefix+'-search');
  const raceSel = document.getElementById(prefix+'-race');
  const errEl = document.getElementById(prefix+'-search-err');
  input.addEventListener('change', ()=>{
    if(errEl) errEl.style.display='none';
    if(!input.value.trim()) return;
    const raceIdx = resolveSearchToRaceIdx(input.value);
    if(raceIdx!=null){
      raceSel.value = String(raceIdx); refreshXSel(raceSel); onChange();
    } else {
      // No match at all (even fuzzy) — reset to "all" rather than silently leaving a stale
      // previous selection on screen looking like it's the search result.
      raceSel.value = 'all'; refreshXSel(raceSel); onChange();
      if(errEl) errEl.style.display='';
    }
  });
  raceSel.addEventListener('change', ()=>{ if(raceSel.value==='all') input.value=''; if(errEl) errEl.style.display='none'; });
}

function granularBreakdown(entityId, topic, totalCount){
  const subs = GRANULAR_TOPICS[topic] || ['General'];
  const rng = seededRng('gran|'+entityId+'|'+topic);
  const weights = subs.map(()=>0.4+rng());
  const wsum = weights.reduce((a,b)=>a+b,0);
  const counts = weights.map(w=>Math.max(1,Math.round(totalCount*w/wsum)));
  const diff = totalCount - counts.reduce((a,b)=>a+b,0);
  counts[0] = Math.max(1, counts[0]+diff);

function topicBarsFromCounts(countByTopic, party){

  const max = Math.max(1, ...Object.values(countByTopic));
  return NARRATIVE_TOPIC_ORDER.map(topic=>{
    const count = countByTopic[topic] || 0;
    const isCore = coreTopicsForParty(party).includes(topic);

      <div class="topic-track"><div class="topic-fill" style="width:${count?clamp(100*count/max,4,100):0}%;background:${color};"></div></div>
      <div class="topic-pct">${count}</div>
    </div>`;
  }).join('');
}
function topicCountsForEntity(entityId){ return Object.fromEntries(METRICS[entityId].topics.map(t=>[t.topic, t.count])); }
function topicCountsForGroup(entities){

function granularFlatListFromCounts(countByTopic, seedFn){
  // Grouped by parent topic in NARRATIVE_TOPIC_ORDER (2026-08-27 feedback: "at least organized in
  // the same order as their parent topics"), not a flat cross-topic sort — sub-topics within one
  // parent still rank by their own count. Topics with zero occurrences contribute no sub-topic rows.
  const flat = [];
  NARRATIVE_TOPIC_ORDER.forEach(topic=>{
    const count = countByTopic[topic] || 0;
    if(!count) return;
    seedFn(topic, count).forEach(g=>flat.push({sub:g.sub, count:g.count, parent:topic}));
  });

}

      <div class="topic-name" style="width:190px;">${escXHtml(g.sub)}<br><span class="small-muted" style="font-weight:400;">${escXHtml(g.parent)}</span></div>
      <div class="topic-track"><div class="topic-fill" style="width:${clamp(100*g.count/max,4,100)}%;background:${color};"></div></div>
      <div class="topic-pct">${g.count}</div>
    </div>`;
  }).join('') || '<div class="small-muted" style="padding:10px 0;">No granular data available.</div>';

function granularBars(entityId){
  const ent = entityById(entityId);

function granularBarsForGroup(entities, party){
  // Sum each entity's own (seeded, deterministic) granular breakdown rather than re-deriving one
  // breakdown for the whole group — keeps each entity's sub-topic split internally consistent with
  // its single-candidate view.
  const combined = {}; // "parent|sub" -> count
  entities.forEach(e=>{
    const counts = topicCountsForEntity(e.id);
    NARRATIVE_TOPIC_ORDER.forEach(topic=>{
      const count = counts[topic]||0;
      if(!count) return;
      granularBreakdown(e.id, topic, count).forEach(g=>{ const k=topic+'|'+g.sub; combined[k]=(combined[k]||0)+g.count; });
    });
  });
  const countByTopic = topicCountsForGroup(entities);
  const flat = granularFlatListFromCounts(countByTopic, (topic)=>{
    const subs = GRANULAR_TOPICS[topic]||['General'];
    return subs.map(sub=>({sub, count: combined[topic+'|'+sub]||0})).filter(r=>r.count>0);
  });
  return granularBarsFromFlat(flat, party);
}

function sampleDateRange(i0, i1, maxSamples){
  const span = i1-i0+1;
  if(span<=maxSamples) return Array.from({length:span}, (_,k)=>i0+k);
  const stride = span/maxSamples;
  const out = []; for(let k=0;k<maxSamples;k++) out.push(i0+Math.round(k*stride));
  return [...new Set(out)];
}
function scoresByCategoryForEntity(ent, key, topicFilter, modelFilter){
  // Uses the comparison chart's own filter bar (date range + prompt type) as the ambient context
  // for category/root-cause breakdowns — consistent with the comparison chart already sourcing
  // its category/issue selectors from the same `${key}-cmp-*` bar.
  const [i0,i1] = dateRangeIdx(key+'-cmp');
  const dateIdxs = sampleDateRange(i0,i1,9);
  let prompts = (PROMPTS_BY_RACE[ent.raceIdx]||[]).filter(p=>p.dims.includes(key));
  if(topicFilter) prompts = prompts.filter(p=>p.topic===topicFilter);
  const blindEl = document.getElementById(key+'-cmp-blind');
  if(blindEl && blindEl.value!=='all') prompts = prompts.filter(p=>p.is_blind===blindEl.value);
  const side = ent.role==='ours' ? 'ours' : 'opp';
  const byCategory = {};
  const byIssueTag = {};
  const models = modelFilter ? [modelFilter] : MODELS;
  prompts.forEach(p=>{
    models.forEach(m=>{ dateIdxs.forEach(di=>{
      const dateStr = DATES[di];
      const run = getRun(p,m,dateStr);
      if(!run) return;
      const v = run.scores[side][key];
      if(v===null||v===undefined) return;
      const cat = p.category;
      const b = bucketOf(key, v);
      const item = {prompt:p, score:v, model:m, bucket:b, date:dateStr, response:run.response, missingTopics: run.missingTopics ? run.missingTopics[side] : []};
      if(!byCategory[cat]) byCategory[cat] = {buckets:{}, total:0, items:[]};
      byCategory[cat].buckets[b] = (byCategory[cat].buckets[b]||0)+1;
      byCategory[cat].total++;
      byCategory[cat].items.push(item);
      if(p.topic){
        if(!byIssueTag[p.topic]) byIssueTag[p.topic] = {buckets:{}, total:0, items:[]};
        byIssueTag[p.topic].buckets[b] = (byIssueTag[p.topic].buckets[b]||0)+1;
        byIssueTag[p.topic].total++;
        byIssueTag[p.topic].items.push(item);
      }
    }); });
  });
  const byBucket = {bio:{buckets:{},total:0,items:[]}, policy:{buckets:{},total:0,items:[]}, other:{buckets:{},total:0,items:[]}};
  Object.keys(byCategory).forEach(cat=>{
    const bkt = categoryBucket(cat); const c=byCategory[cat];
    byBucket[bkt].total += c.total;
    byBucket[bkt].items.push(...c.items);
    Object.entries(c.buckets).forEach(([b,n])=>{ byBucket[bkt].buckets[b]=(byBucket[bkt].buckets[b]||0)+n; });
  });
  return {byCategory, byIssueTag, byBucket};
}
function mergeBucketTotals(list){
  const out = {buckets:{}, total:0};
  list.forEach(d=>{ if(!d) return; out.total += d.total; Object.entries(d.buckets||{}).forEach(([b,n])=>{ out.buckets[b]=(out.buckets[b]||0)+n; }); });
  return out;
}
function entityBucketTotals(ent, key, modelFilter){
  const data = scoresByCategoryForEntity(ent, key, null, modelFilter);
  return mergeBucketTotals(Object.values(data.byCategory));
}
function bucketScoresAcrossEntities(entities, key){
  const acc = {bio:{buckets:{},total:0}, policy:{buckets:{},total:0}, other:{buckets:{},total:0}};
  entities.forEach(e=>{
    const d = scoresByCategoryForEntity(e, key);
    Object.keys(acc).forEach(b=>{ acc[b] = mergeBucketTotals([acc[b], d.byBucket[b]]); });
  });
  return acc;
}
function categoryScoresAcrossEntities(entities, key){
  const acc = {};
  entities.forEach(e=>{
    const d = scoresByCategoryForEntity(e, key);
    Object.entries(d.byCategory).forEach(([cat,c])=>{ acc[cat] = mergeBucketTotals([acc[cat], c]); });
  });

}

  if(f.race!=='all') idxs = idxs.filter(i=>i===parseInt(f.race,10));
  const [i0,i1] = dateRangeIdx('accuracy-trend');
  let rows=[];
  idxs.forEach(idx=>{
    (PROMPTS_BY_RACE[idx]||[]).forEach(p=>{
      MODELS.forEach(m=>{
        const run = getRunInRange(p,m,i0,i1);
        if(!run) return;
        [['ours', ourEntity(idx)], ['opp', oppEntity(idx)]].forEach(([side,ent])=>{
          const issue = run.accIssue[side];
          if(issue && ent) rows.push({ent, p, m, issue, score:run.scores[side].accuracy, response:run.response, date:run.date});
        });
      });
    });
  });
  return rows;
}
function buildAccuracyInsights(){
  const rows = computeAccuracyIssueRows();
  if(!rows.length) return ['No flagged inaccuracies in the current filter — accuracy looks clean.'];
  const bullets = [];
  const byCat={}; rows.forEach(r=>{ byCat[r.issue.category]=(byCat[r.issue.category]||0)+1; });
  const topCat = Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];
  bullets.push(`"${ACCURACY_CATEGORIES.find(c=>c.key===topCat[0])?.label||topCat[0]}" is the most common inaccuracy type (${topCat[1]} of ${rows.length} flagged statements).`);
  const byEnt={}; rows.forEach(r=>{ byEnt[r.ent.name]=(byEnt[r.ent.name]||0)+1; });
  const topEnt = Object.entries(byEnt).sort((a,b)=>b[1]-a[1])[0];
  bullets.push(`${topEnt[0]} has the most flagged statements in view (${topEnt[1]}) — see the prioritized breakdown below.`);
  bullets.push(`${rows.length} statements flagged across ${new Set(rows.map(r=>r.p.id)).size} prompts in the current filter.`);
  return bullets;
}
function buildConsistencyInsights(key){
  const bullets = bucketAndCategoryInsights(key);
  const f = dimFilters(key+'-cmp');
  const [i0,i1]=dateRangeIdx(key+'-trend');
  let entities;
  if(f.race!=='all'){ entities=[ourEntity(parseInt(f.race,10))]; }
  else { const idxs=computeInsightEntities(key); entities = idxs.map(i=>ourEntity(i)); }
  entities = entities.filter(Boolean);
  if(!entities.length) return bullets;
  let worst=null;
  entities.forEach(e=>{ const vol = stddev(METRICS[e.id].history.consistency.slice(i0,i1+1)); if(!worst||vol>worst.vol) worst={e,vol}; });
  if(worst) bullets.push(`${worst.e.name} shows the most day-to-day volatility in this dimension (σ ≈ ${fmt1(worst.vol)}) — worth a closer look at what's driving unstable answers.`);
  return bullets;
}
function buildNarrativeInsights(key){
  const f = dimFilters(key+'-cmp');
  let entities;
  if(f.race!=='all'){ entities=[ourEntity(parseInt(f.race,10))]; }
  else { const idxs=computeInsightEntities(key); entities = idxs.map(i=>ourEntity(i)).filter(e=>e.party==='Democrat'); }
  if(!entities.length) return [];
  const bullets=[];
  const avgScore = avg(entities.map(e=>METRICS[e.id].base.narrative));
  bullets.push(`Average narrative alignment across candidates in view is ${fmt1(avgScore)} out of 100.`);
  let bestGapTopic=null;
  entities.forEach(e=>{ (METRICS[e.id].gaps||[]).forEach(g=>{ if(!bestGapTopic||g.pctMissing>bestGapTopic.pctMissing) bestGapTopic={topic:g.topic,pctMissing:g.pctMissing,name:e.name}; }); });
  if(bestGapTopic) bullets.push(`"${bestGapTopic.topic}" is the narrative topic missing most often — absent from ${bestGapTopic.pctMissing}% of ${bestGapTopic.name}'s responses that should be raising it. Published content that explicitly covers this topic would close the gap.`);
  const emergentAcc={};
  entities.forEach(e=>{ METRICS[e.id].topics.filter(t=>!t.core).forEach(t=>{ emergentAcc[t.topic]=(emergentAcc[t.topic]||0)+t.count; }); });
  const topEmergent = Object.entries(emergentAcc).sort((a,b)=>b[1]-a[1])[0];
  if(topEmergent) bullets.push(`AI responses are also bringing up "${topEmergent[0]}" on their own, even though it isn't part of the current messaging plan — if it keeps coming up, publishing a clear position on it directly would shape how it gets discussed instead of leaving it to chance.`);
  return bullets;
}

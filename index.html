function dimFilters(key){ return {state:document.getElementById(key+'-state').value, race:document.getElementById(key+'-race').value, office:document.getElementById(key+'-office').value, party:document.getElementById(key+'-party').value}; }
function nearestDateIdx(dateStr, roundUp){
  // DATES is sparse (real report dates only) — a date picker lets the user choose any
  // calendar date, so an exact-match lookup would silently snap back to the full range
  // for almost every choice. Snap to the nearest available date instead.
  if(!dateStr) return null;
  const exact = DATES.indexOf(dateStr);
  if(exact>=0) return exact;
  let best=null;
  for(let i=0;i<DATES.length;i++){
    if(roundUp ? DATES[i]>=dateStr : DATES[i]<=dateStr) best=i;
    if(roundUp && DATES[i]>=dateStr) break;
  }
  if(best===null) best = roundUp ? DATES.length-1 : 0;
  return best;
}
function dateRangeIdx(key){ const startEl=document.getElementById(key+'-start'), endEl=document.getElementById(key+'-end'); if(!startEl||!endEl) return [0,DATES.length-1]; const s=startEl.value, en=endEl.value; let i0=s?nearestDateIdx(s,false):0, i1=en?nearestDateIdx(en,true):DATES.length-1; return [Math.min(i0,i1),Math.max(i0,i1)]; }

function renderBucket3Charts(key, fCmp, fTrend){
  const catSelEl = document.getElementById(key+'-cmp-cat');
  const catOpt = (catSelEl && catSelEl.value!=='all') ? catSelEl.value : null;
  const topicSelEl = document.getElementById(key+'-cmp-topic');
  const topicOpt = (catOpt && topicSelEl && topicSelEl.value!=='all') ? topicSelEl.value : null;
  // Visibility is binary — show only the "mentioned" share, not a mentioned/not-mentioned pair.
  const order = (key==='visibility') ? ['1'] : bucket3Order(key);
  function bucketsFor(ent){
    if(!ent) return {buckets:{},total:0};
    if(catOpt){ const d = scoresByCategoryForEntity(ent,key,topicOpt); return d.byCategory[catOpt] || {buckets:{},total:0}; }
    return entityBucketTotals(ent, key);
  }
  function groupBuckets(entities){
    if(catOpt) return mergeBucketTotals(entities.map(e=>scoresByCategoryForEntity(e,key,topicOpt).byCategory[catOpt]));
    return mergeBucketTotals(entities.map(e=>entityBucketTotals(e,key)));
  }
  // Visibility only ever renders one segment ("mentioned") — since there's no second bucket's
  // color to contrast against, color that segment by party instead of a generic outcome color.
  // Multi-bucket dims (favorability/depth/accuracy/consistency) keep outcome-based segment colors,
  // since the segments within one bar are already meaningfully differentiated by outcome.
  function segmentsFor(t, colorOverride){ return order.map(b=>({name:bucket3Label(key,b), value:(t.buckets[b]||0), color:colorOverride||bucket3Color(key,b)})); }
  function rowFor(label, t, colorOverride){ return {label, segments:segmentsFor(t,colorOverride), total:t.total}; }
  const [i0,i1] = dateRangeIdx(key+'-trend'); const labels = DATES.slice(i0,i1+1);
  function groupDailyShare(entities, dayIdx, b){ return avg(entities.map(e=>dailyBucketShare(e.id,key,dayIdx)[b])); }
  const trendCompareEl = document.getElementById(key+'-trend-compare');
  const trendCompareLabelEl = document.getElementById(key+'-trend-compare-label');
  const trendCompare = trendCompareEl ? trendCompareEl.checked : false;

  // --- comparison chart: driven by its own filter bar (key+'-cmp') ---
  if(key==='consistency'){
    // Consistency measures a model's own same-day answer stability, not a candidate-quality
    // judgment — so the meaningful comparison is by AI provider, not by party. Population still
    // respects the filter bar (race narrows to just that race's two entities; otherwise
    // state/office narrow the roster as usual).
    let entities;
    if(fCmp.race!=='all'){
      const idx = parseInt(fCmp.race,10);
      entities = [ourEntity(idx), oppEntity(idx)].filter(Boolean);
    } else {
      let idxs = ROSTER.map((r,i)=>i);
      if(fCmp.state!=='all') idxs = idxs.filter(i=>ROSTER[i].state===fCmp.state);
      if(fCmp.office!=='all') idxs = idxs.filter(i=>ROSTER[i].office===fCmp.office);
      if(fCmp.party!=='all') idxs = idxs.filter(i=>ROSTER[i].party===fCmp.party || (oppEntity(i)&&oppEntity(i).party===fCmp.party));
      entities = idxs.flatMap(i=>[ourEntity(i), oppEntity(i)]).filter(Boolean);
    }
    const rows = MODELS.map(m=>({label:m, segments: catOpt
      ? segmentsFor(mergeBucketTotals(entities.map(e=>scoresByCategoryForEntity(e,key,topicOpt,m).byCategory[catOpt])))
      : segmentsFor(mergeBucketTotals(entities.map(e=>entityBucketTotals(e,key,m))))
    }));
    verticalStackedBarChart(key+'-cmp', rows, {height:260});
  } else if(fCmp.race!=='all'){
    const idx = parseInt(fCmp.race,10); const o=ourEntity(idx), p=oppEntity(idx);
    const rows = [rowFor(o.name, bucketsFor(o), key==='visibility'?partyColor(o.party):null)];
    if(p) rows.push(rowFor(p.name, bucketsFor(p), key==='visibility'?partyColor(p.party):null));
    verticalStackedBarChart(key+'-cmp', rows, {height:260});
  } else {
    let idxs = ROSTER.map((r,i)=>i);
    if(fCmp.state!=='all') idxs = idxs.filter(i=>ROSTER[i].state===fCmp.state);
    if(fCmp.office!=='all') idxs = idxs.filter(i=>ROSTER[i].office===fCmp.office);
    // Grouped by party (not just Dem/Rep) so NP candidates aren't silently dropped from the view.
    const demE = idxs.map(i=>ourEntity(i)).filter(e=>e.party==='Democrat');
    const repE = idxs.map(i=>oppEntity(i)).filter(e=>e&&e.party==='Republican');
    const npE = idxs.map(i=>ourEntity(i)).filter(e=>e.party==='NP');
    const rows = [
      rowFor('Democrats', groupBuckets(demE), key==='visibility'?partyColor('Democrat'):null),
      rowFor('Republicans', groupBuckets(repE), key==='visibility'?partyColor('Republican'):null),
    ];
    if(npE.length) rows.push(rowFor('Non-Partisan', groupBuckets(npE), key==='visibility'?partyColor('NP'):null));
    verticalStackedBarChart(key+'-cmp', rows, {height:260});
  }

  // --- trend chart: driven by its own filter bar (key+'-trend') ---
  if(key==='consistency'){
    let entities;
    if(fTrend.race!=='all'){
      const idx = parseInt(fTrend.race,10);

    const lseries = MODELS.map(m=>({name:m, color:MODEL_COLORS[m], values:labels.map((d,ix)=>avg(entities.map(e=>dailyBucketShare(e.id,key,i0+ix,m)['2'])))}));

  } else if(key==='visibility' && fTrend.race!=='all'){

    const idx = parseInt(fTrend.race,10); const o=ourEntity(idx), p=oppEntity(idx);
    const lseries = [{name:o.name, color:partyColor(o.party), values:labels.map((d,ix)=>dailyBucketShare(o.id,key,i0+ix)['1'])}];
    if(p) lseries.push({name:p.name, color:partyColor(p.party), values:labels.map((d,ix)=>dailyBucketShare(p.id,key,i0+ix)['1'])});
    lineChart(key+'-trend', labels, lseries, {min:0,max:100,height:220});
  } else if(key==='visibility'){
    // Default view: always show all 3 party lines (no "compare" toggle needed — there's only one
    // segment to plot, so there's no information lost by always showing every group).
    let idxs = ROSTER.map((r,i)=>i);
    if(fTrend.state!=='all') idxs = idxs.filter(i=>ROSTER[i].state===fTrend.state);
    if(fTrend.office!=='all') idxs = idxs.filter(i=>ROSTER[i].office===fTrend.office);
    const demE = idxs.map(i=>ourEntity(i)).filter(e=>e.party==='Democrat');
    const repE = idxs.map(i=>oppEntity(i)).filter(e=>e&&e.party==='Republican');
    const npE = idxs.map(i=>ourEntity(i)).filter(e=>e.party==='NP');
    const lseries = [
      {name:'Democrats', color:partyColor('Democrat'), values:labels.map((d,ix)=>groupDailyShare(demE,i0+ix,'1'))},
      {name:'Republicans', color:partyColor('Republican'), values:labels.map((d,ix)=>groupDailyShare(repE,i0+ix,'1'))},
    ];
    if(npE.length) lseries.push({name:'Non-Partisan', color:partyColor('NP'), values:labels.map((d,ix)=>groupDailyShare(npE,i0+ix,'1'))});
    lineChart(key+'-trend', labels, lseries, {min:0,max:100,height:220});
  } else if(fTrend.race!=='all'){
    const idx = parseInt(fTrend.race,10); const o=ourEntity(idx), p=oppEntity(idx);
    if(trendCompareLabelEl) trendCompareLabelEl.textContent = 'Compare with opponent';
    if(trendCompareEl) trendCompareEl.disabled = !p;
    const lseries = order.map(b=>({name:o.name+(order.length>1?' — '+bucket3Label(key,b):''), color:bucket3Color(key,b), values:labels.map((d,ix)=>dailyBucketShare(o.id,key,i0+ix)[b])}));
    if(p && trendCompare) order.forEach(b=>lseries.push({name:p.name+(order.length>1?' — '+bucket3Label(key,b):''), color:bucket3Color(key,b), dash:'4,3', values:labels.map((d,ix)=>dailyBucketShare(p.id,key,i0+ix)[b])}));
    lineChart(key+'-trend', labels, lseries, {min:0,max:100,height:220});
  } else {
    let idxs = ROSTER.map((r,i)=>i);
    if(fTrend.state!=='all') idxs = idxs.filter(i=>ROSTER[i].state===fTrend.state);
    if(fTrend.office!=='all') idxs = idxs.filter(i=>ROSTER[i].office===fTrend.office);
    const demE = idxs.map(i=>ourEntity(i)).filter(e=>e.party==='Democrat');
    const repE = idxs.map(i=>oppEntity(i)).filter(e=>e&&e.party==='Republican');
    if(trendCompareLabelEl) trendCompareLabelEl.textContent = 'Compare with Republicans';
    if(trendCompareEl) trendCompareEl.disabled = false;
    const lseries = order.map(b=>({name:(trendCompare?'Dem — ':'')+(order.length>1?bucket3Label(key,b):'Mentioned'), color:bucket3Color(key,b), values:labels.map((d,ix)=>groupDailyShare(demE,i0+ix,b))}));
    if(trendCompare) order.forEach(b=>lseries.push({name:'Rep — '+(order.length>1?bucket3Label(key,b):'Mentioned'), color:bucket3Color(key,b), dash:'4,3', values:labels.map((d,ix)=>groupDailyShare(repE,i0+ix,b))}));
    lineChart(key+'-trend', labels, lseries, {min:0,max:100,height:220});
  }

function selectConsistencyCandidate(raceIdx){

  sel.value = String(raceIdx); refreshXSel(sel);
  window.__consFlagShowAll = false;
  renderConsistencyFlagged();
  document.getElementById('consistency-flag-table').scrollIntoView({block:'center', behavior:'smooth'});
}
function renderConsistencyFlagged(){
  const candEl = document.getElementById('consistency-flag-cand');
  if(!candEl) return;
  const raceIdx = parseInt(candEl.value,10);
  const ent = ourEntity(raceIdx);
  const modelVal = document.getElementById('consistency-flag-model').value;
  const models = modelVal==='all' ? MODELS : [modelVal];
  const prompts = (PROMPTS_BY_RACE[raceIdx]||[]).filter(p=>p.dims.includes('consistency'));
  const rows = [];
  prompts.forEach(p=>{
    models.forEach(m=>{
      DATES.forEach(d=>{
        const run = getRun(p,m,d);
        if(!run) return;
        const v = run.scores.ours.consistency;
        if(v===null||v===undefined) return;
        rows.push({p, model:m, date:d, score:v});
      });
    });
  });
  rows.sort((a,b)=>a.score-b.score); // worst (least consistent) first
  const showAll = window.__consFlagShowAll;
  const shown = showAll ? rows : rows.slice(0,30);
  let html = `<table><tr><th>Prompt</th><th>Category</th><th>Model</th><th>Date</th><th>Score</th></tr>`;
  shown.forEach(r=>{
    html += `<tr class="clickable" onclick="openConsistencyDetail('${escXAttr(r.p.id)}','${escXAttr(r.model)}','${r.date}',${raceIdx})">
      <td style="max-width:280px;white-space:normal;">${escapeXml(r.p.text)}</td>
      <td class="small-muted">${escXHtml(r.p.category)}</td>
      <td>${escXHtml(r.model)}</td><td class="small-muted">${r.date}</td>
      <td><span class="heat" style="background:${heatColor(r.score,0,2)};color:${heatText(r.score,0,2)}">${r.score}</span></td>
    </tr>`;
  });
  html += `</table>`;
  document.getElementById('consistency-flag-table').innerHTML = html || `<div class="small-muted" style="padding:10px;">No scored consistency runs for this candidate in the current data.</div>`;
  document.getElementById('consistency-flag-more').innerHTML = rows.length>30
    ? `<button class="btn ghost sm" onclick="window.__consFlagShowAll=!window.__consFlagShowAll;renderConsistencyFlagged();">${showAll?'Show top 30 only':'Show all '+rows.length+' prompt runs'}</button><span class="small-muted"> &nbsp;${rows.length} scored prompt runs for ${escXHtml(ent.name)}.</span>`
    : `<span class="small-muted">${rows.length} scored prompt runs for ${escXHtml(ent.name)}.</span>`;
}
function openConsistencyDetail(promptId, model, date, raceIdx){
  const p = PROMPTS.find(x=>x.id===promptId);

      The real design (see <code>DASHBOARD_DATA_SOURCES.md</code> §3.5) shows up to 3 representative

      full same-day history, and includes the scoring judge's own written rationale plus a specific

function renderAccuracyPriority(){

function multiVals(id){ return Array.from(document.getElementById(id).selectedOptions).map(o=>o.value); }
function renderFanoutTable(){
  const parties = multiVals('pf-party'), cands = multiVals('pf-cand'), races = multiVals('pf-race').map(Number),
        offices = multiVals('pf-office'), states = multiVals('pf-state'), cats = multiVals('pf-cat'),
        types = multiVals('pf-type'), models = multiVals('pf-model').length? multiVals('pf-model') : MODELS;
  const [i0,i1] = dateRangeIdx('pf');

  let prompts = PROMPTS.filter(p=>{
    if(races.length && !races.includes(p.raceIdx)) return false;
    if(cands.length && cands.indexOf(p.cand)===-1 && !(p.opp && cands.indexOf(p.opp)!==-1)) return false;
    if(offices.length && offices.indexOf(p.office)===-1) return false;
    if(states.length && states.indexOf(p.state)===-1) return false;
    if(cats.length && cats.indexOf(p.category)===-1) return false;
    if(types.length && types.indexOf(p.is_blind)===-1) return false;
    if(parties.length){ const okCand = parties.indexOf(p.cand_party)!==-1; const okOpp = p.opp_party && parties.indexOf(p.opp_party)!==-1; if(!okCand && !okOpp) return false; }
    return true;
  });

  let rows = [];
  prompts.forEach(p=>{ models.forEach(m=>{ const run=getRunInRange(p,m,i0,i1); if(run) rows.push({p, m, run}); }); });

  const sort = window.__pfSort;
  rows.sort((a,b)=>{
    const val = r => { if(sort.key==='prompt') return r.p.text; const [dim,side]=sort.key.split('_'); return r.run.scores[side][dim]; };
    let av=val(a), bv=val(b);
    if(av===null) av = sort.dir===1? Infinity : -Infinity;
    if(bv===null) bv = sort.dir===1? Infinity : -Infinity;
    if(typeof av==='string') return sort.dir*(av>bv?1:av<bv?-1:0);
    return sort.dir*(av-bv);
  });

  document.getElementById('pf-count').textContent = `${rows.length} prompt × model runs in range`;
  const sortIcon = k => window.__pfSort.key===k ? (window.__pfSort.dir===1?' ▲':' ▼') : '';
  let html = `<table><tr>
    <th onclick="sortFanout('prompt')">Prompt${sortIcon('prompt')}</th><th>Race</th><th>Category</th><th>Named/Blind</th><th>Model</th>
    <th onclick="sortFanout('visibility_ours')">Visibility${sortIcon('visibility_ours')}</th>
    <th onclick="sortFanout('favorability_ours')">Favorability${sortIcon('favorability_ours')}</th>
    <th onclick="sortFanout('depth_ours')">Depth${sortIcon('depth_ours')}</th>
    <th onclick="sortFanout('accuracy_ours')">Accuracy${sortIcon('accuracy_ours')}</th>
    <th onclick="sortFanout('consistency_ours')">Consistency${sortIcon('consistency_ours')}</th>
    <th onclick="sortFanout('narrative_ours')">Narrative${sortIcon('narrative_ours')}</th></tr>`;
  const heat=(v,rangeArr)=> v===null?'<span class="small-muted">—</span>':`<span class="heat" style="background:${heatColor(v,rangeArr[0],rangeArr[1])};color:${heatText(v,rangeArr[0],rangeArr[1])}">${fmt1(v)}</span>`;
  rows.slice(0,400).forEach((r,ri)=>{
    html += `<tr class="clickable" onclick='openPromptHistory(${ri})' data-ri="${ri}">
      <td style="max-width:340px;white-space:normal;">${escapeXml(r.p.text)}</td>
      <td class="small-muted" style="max-width:150px;white-space:normal;">${escapeXml(r.p.race)}</td>
      <td class="small-muted">${r.p.category}</td>
      <td class="small-muted">${r.p.is_blind==='Y'?'Blind':'Named'}</td>
      <td class="small-muted">${r.m}</td>
      <td>${heat(r.run.scores.ours.visibility,DIM_RANGE.visibility)}</td>
      <td>${heat(r.run.scores.ours.favorability,DIM_RANGE.favorability)}</td>
      <td>${heat(r.run.scores.ours.depth,DIM_RANGE.depth)}</td>
      <td>${heat(r.run.scores.ours.accuracy,DIM_RANGE.accuracy)}</td>
      <td>${heat(r.run.scores.ours.consistency,DIM_RANGE.consistency)}</td>
      <td>${heat(r.run.scores.ours.narrative,DIM_RANGE.narrative)}</td></tr>`;
  });
  html += `</table>`;
  document.getElementById('pf-table').innerHTML = html;
  window.__pfRowsCache = rows.slice(0,400);
}
function sortFanout(key){ window.__pfSort.dir = (window.__pfSort.key===key)? -window.__pfSort.dir : -1; window.__pfSort.key=key; renderFanoutTable(); }
function openPromptHistory(ri){
  const row = window.__pfRowsCache[ri];

  openSidePanel(`

    <div id="hist-list">${listHtml}</div>`);
}
function showRunDetail(ri, hi){

      ${scoreRow('Depth','depth')}${scoreRow('Accuracy','accuracy')}
      ${scoreRow('Consistency','consistency')}${scoreRow('Narrative','narrative')}
    </div>`);
}

      <div class="fitem"><label>Model</label><select id="ph-model" multiple>${MODELS.map(m=>`<option>${m}</option>`).join('')}</select></div>
      <div class="fitem"><label>Range start</label><input type="date" id="ph-start"></div>
      <div class="fitem"><label>Range end</label><input type="date" id="ph-end"></div>
    </div>
    <div class="kpis" id="ph-kpis"></div>
    <div class="row2">
      <div class="card"><div class="card-title">Refusal rate by prompt category</div><div class="card-caption">Share of runs where the model declined to answer, by category.</div><div id="ph-refusal-chart"></div></div>
      <div class="card"><div class="card-title">Refusal &amp; veer rate over time</div><div class="card-caption">Daily, across all categories in view.</div><div id="ph-trend"></div></div>
    </div>
    <div class="card section-gap">
      <div class="card-title">Hypothesis alignment by category</div>
      <div class="card-caption">Of the responses that weren't refused: did they engage with the specific angle the prompt was built to test, or drift to something else?</div>
      <div id="ph-align-chart"></div>
      <div class="legend-row"><span><span class="legend-dot" style="background:var(--brand)"></span>On-hypothesis</span><span><span class="legend-dot" style="background:#D9B36C"></span>Veered off-topic</span></div>
    </div>
    <div class="card section-gap">
      <div class="card-title">Prompts flagged for review</div>
      <div class="card-caption">Ranked by combined refusal + veer rate. These are the prompts most consistently failing to do their job — candidates for rewrite or retirement.</div>
      <div class="scroll-table" id="ph-table"></div>
    </div>`;
  document.getElementById('ph-start').value = DATES[0];
  document.getElementById('ph-end').value = DATES[DATES.length-1];
  document.getElementById('page-prompthealth').querySelectorAll('select,input').forEach(elm=>elm.addEventListener('change', renderPromptHealth));
  renderPromptHealth();
}
function phFilters(){
  return {
    cats: multiVals('ph-cat'), office: document.getElementById('ph-office').value, state: document.getElementById('ph-state').value,
    party: document.getElementById('ph-party').value, race: document.getElementById('ph-race').value,
    models: multiVals('ph-model').length? multiVals('ph-model') : MODELS,
  };
}
function renderPromptHealth(){
  const f = phFilters();
  const [i0,i1] = dateRangeIdx('ph'); const rangeDates = DATES.slice(i0,i1+1);
  let prompts = PROMPTS.filter(p=>{
    if(f.cats.length && f.cats.indexOf(p.category)===-1) return false;
    if(f.office!=='all' && p.office!==f.office) return false;
    if(f.state!=='all' && p.state!==f.state) return false;
    if(f.race!=='all' && p.raceIdx!==parseInt(f.race,10)) return false;
    if(f.party!=='all' && p.cand_party!==f.party && p.opp_party!==f.party) return false;
    return true;
  });
  // gather all runs in scope
  let total=0, refused=0, onTopic=0, veered=0;
  const byCat = {}; // cat -> {total,refused,onTopic,veered}
  const byDate = {}; // date -> {total,refused}
  const byPrompt = {}; // p.id -> {p,total,refused,veered}
  prompts.forEach(p=>{
    const cCat = consolidatedCategory(p.category);
    if(!byCat[cCat]) byCat[cCat]={total:0,refused:0,onTopic:0,veered:0};
    if(!byPrompt[p.id]) byPrompt[p.id]={p,total:0,refused:0,veered:0};
    f.models.forEach(m=>{
      rangeDates.forEach(d=>{
        const run = getHealthRun(p,m,d);
        if(!run) return;
        total++; byCat[cCat].total++; byPrompt[p.id].total++;
        if(!byDate[d]) byDate[d]={total:0,refused:0,veered:0,scored:0};
        byDate[d].total++;
        if(run.refused){ refused++; byCat[cCat].refused++; byPrompt[p.id].refused++; byDate[d].refused++; }
        else{
          byDate[d].scored++;
          if(run.alignment==='on_topic'){ onTopic++; byCat[cCat].onTopic++; }
          else { veered++; byCat[cCat].veered++; byPrompt[p.id].veered++; byDate[d].veered++; }
        }
      });
    });
  });
  const scored = onTopic+veered;
  document.getElementById('ph-kpis').innerHTML = `
    <div class="kpi hi"><div class="kpi-label">Refusal rate</div><div class="kpi-value">${total? fmt1(100*refused/total):'—'}%</div><div class="kpi-sub">${refused} of ${total} runs</div></div>
    <div class="kpi"><div class="kpi-label">On-hypothesis rate</div><div class="kpi-value">${scored? fmt1(100*onTopic/scored):'—'}%</div><div class="kpi-sub">of non-refused runs</div></div>
    <div class="kpi"><div class="kpi-label">Veer rate</div><div class="kpi-value">${scored? fmt1(100*veered/scored):'—'}%</div><div class="kpi-sub">of non-refused runs</div></div>
    <div class="kpi"><div class="kpi-label">Prompts in view</div><div class="kpi-value">${prompts.length}</div></div>
    <div class="kpi"><div class="kpi-label">Flagged for review</div><div class="kpi-value">${Object.values(byPrompt).filter(x=>x.total && (x.refused/x.total>0.22 || x.veered/Math.max(1,x.total-x.refused)>0.30)).length}</div><div class="kpi-sub">high refusal or veer rate</div></div>`;

  const cats = Object.keys(byCat).sort();
  barChart('ph-refusal-chart', cats, [{name:'Refusal rate %', color:'var(--bad)', values:cats.map(c=>byCat[c].total? 100*byCat[c].refused/byCat[c].total : null)}], {min:0,max:60,height:280,width:560,rotateLabels:true});
  const alignRows = cats.map(c=>{ const b=byCat[c]; const s=b.onTopic+b.veered; return {label:c, segments:[{name:'On-hypothesis',value:s? b.onTopic:1, color:'var(--brand)'},{name:'Veered',value:s? b.veered:0, color:'#D9B36C'}]}; });
  stackedBarChart('ph-align-chart', alignRows, {width:640, barH:22, rowGap:11, labelW:190});

  const dLabels = rangeDates;
  lineChart('ph-trend', dLabels, [
    {name:'Refusal %', color:'var(--bad)', values: dLabels.map(d=> byDate[d] && byDate[d].total? 100*byDate[d].refused/byDate[d].total : null)},
    {name:'Veer %', color:'#D9B36C', values: dLabels.map(d=> byDate[d] && byDate[d].scored? 100*byDate[d].veered/byDate[d].scored : null)},
  ], {min:0,max:60,height:220});

  const sortKey = window.__phSort || 'health';
  const sortFns = {health:(a,b)=>b.healthScore-a.healthScore, refusal:(a,b)=>b.refRate-a.refRate, veer:(a,b)=>b.veerRate-a.veerRate};
  const flagged = Object.values(byPrompt).map(x=>{
    const refRate = x.total? x.refused/x.total : 0;
    const nonRef = x.total-x.refused;
    const veerRate = nonRef? x.veered/nonRef : 0;
    return {...x, refRate, veerRate, healthScore: refRate*0.55+veerRate*0.45};
  }).sort(sortFns[sortKey]);
  const showAll = window.__showAllState && window.__showAllState['ph-table'];
  const shown = showAll ? flagged : flagged.slice(0,30);
  const sortToggle = `<div style="display:flex;gap:6px;margin-bottom:10px;">
    <button type="button" class="btn ${sortKey==='health'?'':'ghost'} sm" onclick="window.__phSort='health';renderPromptHealth();">Combined score</button>
    <button type="button" class="btn ${sortKey==='refusal'?'':'ghost'} sm" onclick="window.__phSort='refusal';renderPromptHealth();">Refusal rate</button>
    <button type="button" class="btn ${sortKey==='veer'?'':'ghost'} sm" onclick="window.__phSort='veer';renderPromptHealth();">Veer rate</button>
  </div>`;
  let html = sortToggle + `<table><tr><th>Prompt</th><th>Category</th><th>Refusal rate</th><th>Veer rate</th><th>Runs</th><th>Flag</th></tr>`;
  shown.forEach(x=>{
    const flag = x.refRate>0.22 && x.veerRate>0.30 ? '<span class="tag recur">high refusal + veer</span>' : x.refRate>0.22 ? '<span class="tag recur">high refusal</span>' : x.veerRate>0.30 ? '<span class="tag recur">high veer</span>' : '<span class="small-muted">within norms</span>';
    html += `<tr class="clickable" onclick="openPromptHealthDetail('${escXAttr(x.p.id)}')"><td style="max-width:280px;white-space:normal;">${escapeXml(x.p.text)}</td><td class="small-muted">${x.p.category}</td>
      <td>${fmt1(100*x.refRate)}%</td><td>${fmt1(100*x.veerRate)}%</td><td class="small-muted">${x.total}</td><td>${flag}</td></tr>`;
  });
  html += `</table>`;
  if(flagged.length>30) html += `<div style="margin-top:10px;"><button class="btn ghost sm" onclick="window.__showAllState=window.__showAllState||{};window.__showAllState['ph-table']=!window.__showAllState['ph-table'];renderPromptHealth();">${showAll?'Show top 30 only':'Show all '+flagged.length+' prompts'}</button><span class="small-muted"> &nbsp;${flagged.length} prompts in view.</span></div>`;
  document.getElementById('ph-table').innerHTML = html;
}
function openPromptHealthDetail(promptId){
  const p = PROMPTS.find(x=>x.id===promptId);
  if(!p){ openSidePanel('<div class="small-muted">Prompt not found.</div>'); return; }
  const f = phFilters();
  const [i0,i1] = dateRangeIdx('ph');
  const rangeDates = DATES.slice(i0,i1+1);
  const runs = [];
  f.models.forEach(m=>{ rangeDates.forEach(d=>{
    const run = getHealthRun(p,m,d);
    if(!run) return;
    const fullRun = getRun(p,m,d); // for the actual response text
    runs.push({m, d, run, response: fullRun?fullRun.response:''});
  }); });
  runs.sort((a,b)=> b.d.localeCompare(a.d));
  const statusHtml = (run)=> run.refused
    ? '<span style="font-weight:600;color:var(--bad);">Refused</span>'
    : run.alignment==='on_topic' ? '<span style="font-weight:600;color:var(--good);">On-hypothesis</span>'
    : run.alignment==='veered' ? '<span style="font-weight:600;color:#B08A3F;">Veered off-topic</span>'
    : '<span class="small-muted">Unscored</span>';
  const html = `
    <div style="margin-bottom:14px;">
      <div class="card-title" style="font-size:16px;margin-bottom:2px;">${escapeXml(p.text)}</div>
      <div class="small-muted">${escXHtml(p.category)} · what this prompt tests for · ${runs.length} real run${runs.length===1?'':'s'} in the current filter</div>
    </div>
    ${runs.map(r=>`
      <div style="border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px;">
          ${statusHtml(r.run)}
          <span class="small-muted">${escXHtml(r.m)} · ${r.d}</span>
        </div>
        <details ${runs.length===1?'open':''}><summary style="cursor:pointer;font-size:11.5px;color:var(--brand);font-weight:600;">Full response</summary><div class="run-detail" style="margin-top:6px;">${r.response?escapeXml(r.response):'<span class="small-muted">No response text stored for this run.</span>'}</div></details>
      </div>`).join('') || '<div class="small-muted">No real runs for this prompt in the current filter.</div>'}
  `;
  openSidePanel(html);
}

/* ============================================================================
   13. CITATION BREAKOUT PAGE
   ============================================================================ */
function buildCitationsPage(){
  document.getElementById('page-citations').innerHTML = `
    <div class="page-head"><div><div class="page-title">Citation Breakout</div></div></div>
    <div class="filterbar">
      <div class="fitem"><label>Office</label><select id="cb-office">${selectOptions(ALL_OFFICES,'All')}</select></div>
      <div class="fitem"><label>State</label><select id="cb-state">${selectOptions(ALL_STATES,'All')}</select></div>
      <div class="fitem"><label>Race</label><select id="cb-race"><option value="all">All</option>${ALL_RACES.map(r=>opt(r.idx,r.label)).join('')}</select></div>
      <div class="fitem"><label>Range start</label><input type="date" id="cb-start"></div>
      <div class="fitem"><label>Range end</label><input type="date" id="cb-end"></div>
      <div class="fitem">
        <label>Source type</label>
        <div style="display:flex;gap:10px;align-items:center;height:32px;">
          <label style="display:flex;align-items:center;gap:4px;font-weight:400;font-size:12px;"><input type="checkbox" id="cb-src-cited" checked> Cited in response</label>
          <label style="display:flex;align-items:center;gap:4px;font-weight:400;font-size:12px;"><input type="checkbox" id="cb-src-search"> Search results shown</label>
          <label style="display:flex;align-items:center;gap:4px;font-weight:400;font-size:12px;"><input type="checkbox" id="cb-src-more" checked> Related/more sources</label>
        </div>
      </div>
    </div>
    <div class="kpis" id="cb-kpis"></div>
    <div class="card">
      <div class="card-title">Citation mix</div>
      <div class="card-caption">Every citation across responses in view, by category.</div>
      <div id="cb-stackbar"></div>
    </div>
    <div class="card section-gap">
      <div class="breadcrumbs" id="cb-crumbs" style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;"></div>
      <div id="cb-drill"></div>
    </div>`;
  // Citations have their own date range (Evertune's sample dates), not DATES (prompt_results').
  const citationDates = [...new Set(CITATION_EVENTS.map(e=>e.date))].sort();
  document.getElementById('cb-start').value = citationDates[0] || '';
  document.getElementById('cb-end').value = citationDates[citationDates.length-1] || '';
  document.getElementById('page-citations').querySelectorAll('.filterbar select,.filterbar input').forEach(elm=>elm.addEventListener('change', ()=>{ window.__cbDrill = {level:'category'}; renderCitations(); }));
  window.__cbDrill = {level:'category'};
  renderCitations();
}
function cbFilteredEvents(){
  const office = document.getElementById('cb-office').value, state = document.getElementById('cb-state').value, race = document.getElementById('cb-race').value;
  // NOT dateRangeIdx('cb')/DATES here — citations have their own date range (Evertune's sample
  // dates), which don't overlap with prompt_results' dates (CampSight's) at all; indexing into
  // DATES would silently match zero citations. Compare date strings directly instead.
  const startVal = document.getElementById('cb-start').value, endVal = document.getElementById('cb-end').value;
  const srcTypesOn = {sources_cited: document.getElementById('cb-src-cited').checked, sources_search: document.getElementById('cb-src-search').checked, sources_more: document.getElementById('cb-src-more').checked};
  return CITATION_EVENTS.filter(e=>{
    if(office!=='all' && e.office!==office) return false;
    if(state!=='all' && e.state!==state) return false;
    if(race!=='all' && String(e.raceIdx)!==race) return false;
    if(startVal && e.date<startVal) return false;
    if(endVal && e.date>endVal) return false;
    if(!srcTypesOn[e.source_type]) return false;
    return true;
  });
}
function cbCrumb(label, onClick, isLast){
  return `<span style="${isLast?'font-weight:700;color:var(--ink);':'cursor:pointer;color:var(--brand);'}" ${onClick?`onclick="${onClick}"`:''}>${escXHtml(label)}</span>`;
}
function renderCitations(){
  const events = cbFilteredEvents();
  const domainKey = e => e.catKey+'||'+e.domain;
  // "Citations" = summed source_count (each row's weight), not row count — a row is one
  // (domain,url,date,model,source_type) combination that can represent many actual citations
  // (DASHBOARD_DATA_SOURCES.md 3.6: "any date-range view sums source_count... then sorts
  // descending"). Real source_count ranges from 1 to 100+ per row, so counting rows understated
  // real citation volume by ~13x (7,682 rows vs. 103,857 summed citations for the full AZ-01 set).
  const total = events.reduce((s,e)=>s+e.count,0);
  const byCat = {};
  events.forEach(e=>{ byCat[e.catKey] = (byCat[e.catKey]||0)+e.count; });
  document.getElementById('cb-kpis').innerHTML = `
    <div class="kpi hi"><div class="kpi-label">Total citations</div><div class="kpi-value">${total}</div><div class="kpi-sub">in current filter view</div></div>
    <div class="kpi"><div class="kpi-label">Unique domains</div><div class="kpi-value">${new Set(events.map(e=>e.domain)).size}</div></div>
    <div class="kpi"><div class="kpi-label">Candidate-owned share</div><div class="kpi-value">${total? fmt1(100*(byCat['Candidate/Officeholder-Owned Content']||0)/total):'—'}%</div></div>
    <div class="kpi"><div class="kpi-label">Local + national news share</div><div class="kpi-value">${total? fmt1(100*((byCat['Local/Regional News']||0)+(byCat['National News']||0))/total):'—'}%</div></div>`;

  const segs = CITATION_CATEGORIES.map(c=>({name:c.label, value:byCat[c.key]||0, color:c.color})).filter(s=>s.value>0);
  stackedBarChart('cb-stackbar', [{label:'All citations', segments:segs.length?segs:[{name:'None',value:1,color:'#EEF1F4'}]}], {width:700, barH:30, rowGap:0, labelW:0});

  const drill = window.__cbDrill || {level:'category'};
  const crumbs = [cbCrumb('Citations', "window.__cbDrill={level:'category'};renderCitations();", drill.level==='category')];
  if(drill.level==='domain'||drill.level==='url'){
    const catInfo = CITATION_CATEGORIES.find(c=>c.key===drill.catKey);
    crumbs.push(' / '+cbCrumb(catInfo.label, `window.__cbDrill={level:'domain',catKey:'${drill.catKey}'};renderCitations();`, drill.level==='domain'));
  }
  if(drill.level==='url'){
    crumbs.push(' / '+cbCrumb(drill.domain, null, true));
  }
  document.getElementById('cb-crumbs').innerHTML = crumbs.join('');

  const drillEl = document.getElementById('cb-drill');
  if(drill.level==='category'){
    const rows = CITATION_CATEGORIES.map(c=>({key:c.key,label:c.label,color:c.color,count:byCat[c.key]||0}))
      .sort((a,b)=> (a.key==='Other')-(b.key==='Other') || b.count-a.count); // "Other" always last, regardless of count
    const max = Math.max(1,...rows.map(r=>r.count));
    drillEl.innerHTML = `<div class="card-title" style="margin-bottom:8px;">Top categories by citation frequency</div>` + rows.map(r=>`
      <div class="topic-row" style="cursor:pointer;" onclick="window.__cbDrill={level:'domain',catKey:'${r.key}'};renderCitations();">
        <div class="topic-name" style="width:190px;">${escXHtml(r.label)}</div>
        <div class="topic-track"><div class="topic-fill core" style="width:${clamp(100*r.count/max,2,100)}%;background:${r.color};"></div></div>
        <div class="topic-pct" style="width:54px;">${r.count}</div>
      </div>`).join('') + (total? '' : `<div class="small-muted section-gap">No citations match the current filters.</div>`);
  } else if(drill.level==='domain'){
    const catEvents = events.filter(e=>e.catKey===drill.catKey);
    const byDom = {};
    catEvents.forEach(e=>{ byDom[e.domain]=(byDom[e.domain]||0)+e.count; });
    const rows = Object.entries(byDom).map(([domain,count])=>({domain,count})).sort((a,b)=>b.count-a.count);
    const max = Math.max(1,...rows.map(r=>r.count));
    const catInfo = CITATION_CATEGORIES.find(c=>c.key===drill.catKey);
    drillEl.innerHTML = `<div class="card-title" style="margin-bottom:8px;">Top domains in "${escXHtml(catInfo.label)}"</div>` + (rows.length? rows.map(r=>`
      <div class="topic-row" style="cursor:pointer;" onclick="window.__cbDrill={level:'url',catKey:'${drill.catKey}',domain:'${escXAttr(r.domain)}'};renderCitations();">
        <div class="topic-name" style="width:190px;">${escXHtml(r.domain)}</div>
        <div class="topic-track"><div class="topic-fill core" style="width:${clamp(100*r.count/max,2,100)}%;background:${catInfo.color};"></div></div>
        <div class="topic-pct" style="width:54px;">${r.count}</div>
      </div>`).join('') : `<div class="small-muted">No domains in this category for the current filters.</div>`);
  } else if(drill.level==='url'){
    const domEvents = events.filter(e=>e.catKey===drill.catKey && e.domain===drill.domain);
    const byUrl = {};
    domEvents.forEach(e=>{ byUrl[e.url]=(byUrl[e.url]||0)+e.count; });
    const rows = Object.entries(byUrl).map(([url,count])=>({url,count})).sort((a,b)=>b.count-a.count);
    drillEl.innerHTML = `<div class="card-title" style="margin-bottom:8px;">Top URLs on ${escXHtml(drill.domain)}</div><div class="scroll-table"><table><tr><th>URL</th><th>Citations</th></tr>` +
      rows.map(r=>`<tr><td style="max-width:420px;white-space:normal;word-break:break-all;">${escXHtml(r.url)}</td><td>${r.count}</td></tr>`).join('') + `</table></div>`;
  }
}

/* ============================================================================
   11. INIT — waits for real data (loadAllData + buildFromFetchedData) before
   building any page, since every buildXPage() reads ROSTER/PROMPTS/METRICS.
   ============================================================================ */
async function initDashboard(){
  const loadingEl = document.getElementById('data-loading');
  try {
    await loadAllData();
    buildFromFetchedData();
  } catch(err) {
    if(loadingEl) loadingEl.innerHTML = '<div style="padding:40px;text-align:center;color:#B23B3B;">Failed to load dashboard data: '+escXHtml(String(err))+'<br><br>Check that dashboard_data/dist/*.json exist and this page is served over http(s), not file://.</div>';
    console.error('Dashboard data load failed', err);
    return;
  }
  safe('overview', buildOverviewPage);
  safe('fanout', buildFanoutPage);
  safe('visibility', ()=>buildDimensionPage('visibility'));
  safe('favorability', ()=>buildDimensionPage('favorability'));
  safe('depth', ()=>buildDimensionPage('depth'));
  safe('accuracy', buildAccuracyPage);
  safe('consistency', ()=>buildDimensionPage('consistency'));
  safe('narrative', ()=>buildDimensionPage('narrative'));
  safe('prompthealth', buildPromptHealthPage);
  safe('citations', buildCitationsPage);
  enhanceSelects();
  collapseAllFilterbars();
  if(loadingEl) loadingEl.remove();
}
initDashboard();
</script>
